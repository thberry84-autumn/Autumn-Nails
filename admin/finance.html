<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments | Autumn Nails</title><style>:root{--ink:#64342d;--muted:#80584d;--paper:#fbf3ed;--cream:#fffaf6;--line:rgba(100,52,45,.14);--shadow:0 24px 70px rgba(95,55,45,.12)}*{box-sizing:border-box}html{font-size:18px}body{margin:0;background:linear-gradient(135deg,#f7ebe3,#fcf5f0 46%,#f1dfd4);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1150px,calc(100% - 28px));margin:auto;padding:20px 0 60px}.topbar{position:sticky;top:16px;z-index:10;background:rgba(255,250,246,.94);backdrop-filter:blur(14px);border:1px solid white;box-shadow:0 16px 38px rgba(90,48,40,.1);border-radius:999px;padding:12px 14px 12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;white-space:nowrap}.brand::before{content:"";display:block;width:126px;height:52px;background:url('/images/autumn-nails-logo.svg?v=20260903') center left/contain no-repeat}.brand strong,.brand span{display:none}.nav{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.nav a{font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;padding:10px 11px;border-radius:999px}.nav a.active,.nav a:hover{background:var(--paper)}.logout{border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:white;color:var(--ink);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;cursor:pointer}main{margin-top:55px}.kicker{font-size:.74rem;text-transform:uppercase;letter-spacing:.23em;color:#a06b59;margin-bottom:10px}h1{font:400 clamp(2.7rem,5vw,4.5rem) Georgia,serif;margin:0 0 8px;letter-spacing:-.045em}.intro{color:var(--muted);line-height:1.6;font-size:1rem}.card{background:rgba(255,250,246,.94);border:1px solid white;border-radius:26px;padding:20px;box-shadow:var(--shadow);margin-top:28px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.94rem}th{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fffaf6;color:var(--ink)}button.save{border:0;border-radius:999px;padding:9px 14px;background:var(--ink);color:white;font-weight:700;cursor:pointer;font-size:.76rem}.muted{color:var(--muted)}.msg{margin:12px 0;padding:10px;border-radius:10px;background:#f2e3da;display:none;font-size:.9rem}@media(max-width:900px){.topbar{border-radius:24px;align-items:flex-start}}@media(max-width:650px){.nav{justify-content:flex-start}}</style></head><body><div class="wrap"><header class="topbar"><a class="brand" href="/"><strong>Autumn</strong><span>Nails</span></a><nav class="nav"><a href="/admin/">Home</a><a href="/admin/booking.html">Bookings</a><a href="/admin/clients.html">Clients</a><a href="/admin/photos.html">Photos</a><a href="/admin/marketing.html">Marketing</a><a class="active" href="/admin/finance.html">Payments</a></nav><button class="logout" onclick="sessionStorage.removeItem('an_booking_admin');location.href='/admin/login.html'">Log out</button></header><main><div class="kicker">Charges & records</div><h1>Payments</h1><p class="intro">Keep the original booked price, apply a loyalty or other adjustment, and record the final charge and payment status. Every change is logged.</p><div id="msg" class="msg"></div><section class="card"><table><thead><tr><th>Date & time</th><th>Client</th><th>Treatment</th><th>Booked</th><th>Adjustment £</th><th>Final £</th><th>Payment</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody></table></section></main></div><script>const API='https://autumn-nails-booking.thberry84.workers.dev',token=sessionStorage.getItem('an_booking_admin'),rows=document.getElementById('rows'),msg=document.getElementById('msg');function money(p){return'£'+(Number(p||0)/100).toFixed(2)}function dateTime(b){const d=new Date(`${b.date}T${b.start_time}:00`);return`${new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(d)}<br>${b.start_time}`}function show(text){msg.textContent=text;msg.style.display='block'}async function load(){if(!token){location.href='/admin/login.html';return}try{const r=await fetch(`${API}/api/admin/finance`,{headers:{Authorization:'Bearer '+token},cache:'no-store'}),data=await r.json();if(r.status===401){location.href='/admin/login.html';return}if(!r.ok)throw Error(data.error||'Unable to load payments.');rows.innerHTML=(data.bookings||[]).map(b=>{const adj=(Number(b.price_adjustment_pence||0)/100).toFixed(2);return`<tr><td>${dateTime(b)}</td><td><strong>${esc(`${b.first_name||''} ${b.surname||''}`)}</strong><br><span class="muted">${esc(b.email||'')}</span></td><td>${esc(b.bookedService||b.service_id||'')}<br><span class="muted">${esc(b.status)}</span></td><td>${money(b.price_pence)}</td><td><input id="adj-${b.id}" type="number" step="0.01" value="${adj}"></td><td><strong id="final-${b.id}">${money(b.final_price_pence??b.price_pence)}</strong></td><td><select id="pay-${b.id}"><option value="unpaid" ${b.payment_status==='unpaid'?'selected':''}>Unpaid</option><option value="paid" ${b.payment_status==='paid'?'selected':''}>Paid</option><option value="refunded" ${b.payment_status==='refunded'?'selected':''}>Refunded</option><option value="not-required" ${b.payment_status==='not-required'?'selected':''}>Not required</option></select></td><td><button class="save" onclick="save('${b.id}')">Save</button></td></tr>`}).join('')||'<tr><td colspan="8" class="muted">No bookings yet.</td></tr>'}catch(e){show(e.message)}}async function save(id){const adjustment=Math.round(Number(document.getElementById(`adj-${id}`).value||0)*100),paymentStatus=document.getElementById(`pay-${id}`).value;try{const r=await fetch(`${API}/api/admin/bookings/${encodeURIComponent(id)}/finance`,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({priceAdjustmentPence:adjustment,paymentStatus})}),data=await r.json();if(!r.ok)throw Error(data.error||'Could not save.');document.getElementById(`final-${id}`).textContent=money(data.booking.finalPricePence);show('Saved. The finance change has been recorded.')}catch(e){show(e.message)}}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}load();</script></body></html>
