<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autumn Nails — Payments</title>
<style>
:root{--ink:#64342d;--muted:#80584d;--cream:#fffaf6;--line:#eadbd2}*{box-sizing:border-box}body{margin:0;background:#f7eee8;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font:400 2rem Georgia,serif}.brand span{font:700 .62rem Arial,sans-serif;letter-spacing:.35em}nav a{color:var(--ink);margin-left:12px;font-size:.78rem}.card{background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:20px;overflow:auto}h1{font:400 2rem Georgia,serif;margin:0 0 8px}.intro{color:var(--muted);font-size:.9rem;margin-bottom:20px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.82rem}th{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fffaf6;color:var(--ink)}button{border:0;border-radius:999px;padding:9px 14px;background:var(--ink);color:white;font-weight:700;cursor:pointer}.muted{color:var(--muted)}.status{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.msg{margin:12px 0;padding:10px;border-radius:10px;background:#f2e3da;display:none}
</style>
</head>
<body><div class="wrap"><header><div class="brand">Autumn <span>NAILS</span></div><nav><a href="/admin/booking.html">Bookings</a><a href="/admin/clients.html">Clients</a><a href="/admin/marketing.html">Marketing</a></nav></header><h1>Payments & charges</h1><p class="intro">Keep the original booked price, apply a loyalty or other adjustment, and record the final charge and payment status. Every change is logged.</p><div id="msg" class="msg"></div><div class="card"><table><thead><tr><th>Date & time</th><th>Client</th><th>Treatment</th><th>Booked</th><th>Adjustment £</th><th>Final £</th><th>Payment</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody></table></div></div>
<script>
const API='https://autumn-nails-booking.thberry84.workers.dev';
const token=localStorage.getItem('autumnAdminToken');
const rows=document.getElementById('rows'),msg=document.getElementById('msg');
function money(p){return `£${(Number(p||0)/100).toFixed(2)}`}
function dateTime(b){const d=new Date(`${b.date}T${b.start_time}:00`);return `${new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(d)}<br>${b.start_time}`}
function show(text){msg.textContent=text;msg.style.display='block'}
async function load(){if(!token){show('Please sign in through the booking admin first.');return}try{const r=await fetch(`${API}/api/admin/finance`,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to load payments.');rows.innerHTML=(data.bookings||[]).map(b=>{const adj=(Number(b.price_adjustment_pence||0)/100).toFixed(2);const final=(Number(b.final_price_pence??b.price_pence)/100).toFixed(2);return `<tr><td>${dateTime(b)}</td><td><strong>${esc(`${b.first_name||''} ${b.surname||''}`)}</strong><br><span class="muted">${esc(b.email||'')}</span></td><td>${esc(b.bookedService||b.service_id||'')}<br><span class="muted">${b.status}</span></td><td>${money(b.price_pence)}</td><td><input id="adj-${b.id}" type="number" step="0.01" value="${adj}"></td><td><strong id="final-${b.id}">${money(b.final_price_pence??b.price_pence)}</strong></td><td><select id="pay-${b.id}"><option value="unpaid" ${b.payment_status==='unpaid'?'selected':''}>Unpaid</option><option value="paid" ${b.payment_status==='paid'?'selected':''}>Paid</option><option value="refunded" ${b.payment_status==='refunded'?'selected':''}>Refunded</option><option value="not-required" ${b.payment_status==='not-required'?'selected':''}>Not required</option></select></td><td><button onclick="save('${b.id}',${Number(b.price_pence||0)})">Save</button></td></tr>`}).join('')||'<tr><td colspan="8" class="muted">No bookings yet.</td></tr>'}catch(e){show(e.message)}}
async function save(id,original){const adjustment=Math.round(Number(document.getElementById(`adj-${id}`).value||0)*100);const paymentStatus=document.getElementById(`pay-${id}`).value;try{const r=await fetch(`${API}/api/admin/bookings/${encodeURIComponent(id)}/finance`,{method:'PATCH',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({priceAdjustmentPence:adjustment,paymentStatus})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not save.');document.getElementById(`final-${id}`).textContent=money(data.booking.finalPricePence);show('Saved. The finance change has been recorded.');}catch(e){show(e.message)}}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
load();
</script></body></html>
