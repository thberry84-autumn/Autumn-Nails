<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photos | Autumn Nails</title><style>:root{--ink:#64342d;--muted:#80584d;--paper:#fbf3ed;--cream:#fffaf6;--line:rgba(100,52,45,.14);--shadow:0 24px 70px rgba(95,55,45,.12)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7ebe3,#fcf5f0 46%,#f1dfd4);font-family:Arial,sans-serif;color:var(--ink)}a{color:inherit;text-decoration:none}.wrap{width:min(1150px,calc(100% - 28px));margin:auto;padding:20px 0 60px}.topbar{position:sticky;top:16px;z-index:10;background:rgba(255,250,246,.94);backdrop-filter:blur(14px);border:1px solid white;box-shadow:0 16px 38px rgba(90,48,40,.1);border-radius:999px;padding:12px 14px 12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:0;white-space:nowrap}.brand strong,.brand span{display:none}.brand::before{content:"";display:block;width:126px;height:52px;background:url('/images/autumn-nails-logo.svg?v=20260903') center left/contain no-repeat}.nav{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.nav a{font-size:.58rem;letter-spacing:.11em;text-transform:uppercase;padding:10px 11px;border-radius:999px}.nav a.active,.nav a:hover{background:var(--paper)}.logout{border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:white;color:var(--ink);font-size:.57rem;text-transform:uppercase;letter-spacing:.1em;cursor:pointer}main{margin-top:55px}.kicker{font-size:.62rem;text-transform:uppercase;letter-spacing:.23em;color:#a06b59;margin-bottom:10px}h1{font:400 clamp(2.7rem,5vw,4.5rem) Georgia,serif;margin:0 0 8px;letter-spacing:-.045em}.muted{color:var(--muted);line-height:1.6}.card{background:rgba(255,250,246,.94);border:1px solid white;border-radius:26px;box-shadow:var(--shadow);padding:24px;margin-top:28px}.upload{display:grid;gap:14px}.upload input[type=file]{padding:18px;border:1px dashed var(--line);border-radius:16px;background:white;width:100%}.caption-grid{display:grid;gap:12px}.caption-row{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:16px;background:white}.caption-row img{width:90px;height:90px;object-fit:cover;border-radius:14px}.caption-row input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;color:var(--ink)}.caption-label{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:#956f64;display:block;margin-bottom:6px}.btn{border:0;border-radius:999px;padding:11px 16px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;font-size:.57rem}.msg{min-height:18px;font-size:.75rem;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.photo{background:white;border-radius:16px;overflow:hidden;border:1px solid var(--line)}.photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.photo-body{padding:11px}.photo-body input{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px}.delete{background:white;color:#9b3d32;border:1px solid var(--line)}@media(max-width:950px){.gallery{grid-template-columns:repeat(3,1fr)}.topbar{border-radius:24px;align-items:flex-start}}@media(max-width:700px){.gallery{grid-template-columns:repeat(2,1fr)}.nav{justify-content:flex-start}.brand span{display:none}.caption-row{grid-template-columns:72px 1fr}.caption-row img{width:72px;height:72px}}@media(max-width:450px){.gallery{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="topbar"><a class="brand" href="/admin/"><strong>Autumn</strong><span>Nails</span></a><nav class="nav"><a href="/admin/">Home</a><a href="/admin/booking.html">Bookings</a><a href="/admin/clients.html">Clients</a><a class="active" href="/admin/photos.html">Photos</a><a href="/admin/marketing.html">Marketing</a><a href="/admin/finance.html">Payments</a></nav><button class="logout" onclick="sessionStorage.removeItem('an_booking_admin');sessionStorage.removeItem('an_photo_admin');location.href='/admin/booking.html'">Log out</button></header><main><div class="kicker">Nail gallery</div><h1>Photos</h1><p class="muted">Upload finished nail sets and give each photo its own caption before it goes into the gallery.</p><section class="card"><h2 style="font:400 1.6rem Georgia,serif">Add photos</h2><div class="upload"><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="captionHelp" class="muted">Choose your photo(s) above. A caption box will appear for each one.</div><div id="captions" class="caption-grid"></div><div><button id="upload" class="btn">Upload selected photos</button></div><div id="msg" class="msg"></div></div></section><section class="card"><h2 style="font:400 1.6rem Georgia,serif">Gallery</h2><div id="gallery" class="gallery"><div class="muted">Loading…</div></div></section></main></div><script>const API='https://autumn-nails-upload.thberry84.workers.dev';let token=sessionStorage.getItem('an_photo_admin')||sessionStorage.getItem('an_booking_admin'),files=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}async function loginPhoto(){const email=prompt('Autumn Nails admin email');if(email===null)return false;const password=prompt('Autumn Nails admin password');if(password===null)return false;const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||'Could not log in to the photo area.');return false}token=d.token;sessionStorage.setItem('an_photo_admin',token);return true}async function validPhotoToken(){if(!token)return false;try{const r=await fetch(API+'/api/session',{headers:{Authorization:'Bearer '+token},cache:'no-store'});return r.ok&&(await r.json()).authenticated===true}catch{return false}}async function ensurePhotoToken(){if(await validPhotoToken())return true;sessionStorage.removeItem('an_photo_admin');token=null;return loginPhoto()}async function load(){if(!await ensurePhotoToken())return;const r=await fetch(API+'/api/gallery',{headers:{Authorization:'Bearer '+token},cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok){$('gallery').innerHTML='<div class="muted">'+esc(d.error||'Could not load gallery.')+'</div>';return}const list=d.files||[];$('gallery').innerHTML=list.length?list.map(f=>'<article class="photo"><img src="'+esc(f.url)+'" alt="'+esc(f.caption||'Autumn Nails')+'" loading="lazy"><div class="photo-body"><input value="'+esc(f.caption||'')+'" aria-label="Caption" disabled><button class="btn delete" onclick="removePhoto(\''+encodeURIComponent(f.name)+'\')">Delete</button></div></article>').join(''):'<div class="muted">No photos in the gallery yet.</div>'}function renderFiles(){files=[...$('files').files];$('captionHelp').textContent=files.length?files.length+' photo'+(files.length===1?'':'s')+' selected — add a caption to each below (optional).':'Choose your photo(s) above. A caption box will appear for each one.';$('captions').innerHTML=files.map((f,i)=>'<div class="caption-row"><img src="'+URL.createObjectURL(f)+'" alt=""><div><label class="caption-label" for="cap-'+i+'">Caption for '+esc(f.name)+'</label><input id="cap-'+i+'" maxlength="180" placeholder="e.g. Soft autumn BIAB with chrome" autocomplete="off"></div></div>').join('')}$('files').onchange=renderFiles;$('upload').onclick=async()=>{if(!files.length){$('msg').textContent='Choose one or more photos first.';return}if(!await ensurePhotoToken())return;const form=new FormData();files.forEach(f=>form.append('files',f));const captions={};files.forEach((_,i)=>captions[String(i)]=$('cap-'+i).value.trim());form.append('captions',JSON.stringify(captions));$('msg').textContent='Uploading…';try{const r=await fetch(API+'/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:form}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Upload failed.');$('msg').textContent='✓ Photos uploaded';$('files').value='';$('captions').innerHTML='';files=[];await load()}catch(e){$('msg').textContent=e.message}};window.removePhoto=async name=>{if(!confirm('Remove this photo from the gallery?'))return;const r=await fetch(API+'/api/gallery/'+name,{method:'DELETE',headers:{Authorization:'Bearer '+token}}),d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||'Could not remove photo.');return}await load()};load();</script></body></html>
