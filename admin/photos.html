<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autumn Nails — Photos</title><style>:root{--ink:#64342d;--ink2:#80584d;--cream:#fffaf6;--line:rgba(100,52,45,.14)}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f7ebe3,#fcf5f0 46%,#f1dfd4)}main{width:min(1100px,calc(100% - 28px));margin:30px auto;padding-bottom:70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;align-items:flex-end;gap:8px}.brand strong{font:400 2.1rem Georgia,serif}.brand span{font-size:.6rem;letter-spacing:.42em;text-transform:uppercase;margin-bottom:8px}.muted{color:var(--ink2);font-size:.84rem;line-height:1.6}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:28px;padding:8px;background:rgba(255,250,246,.82);border:1px solid var(--line);border-radius:999px}.nav a{color:var(--ink);text-decoration:none;padding:10px 15px;border-radius:999px;font-size:.62rem;text-transform:uppercase;letter-spacing:.12em}.nav a:hover,.nav a.active{background:var(--ink);color:#fff}.panel{background:rgba(255,250,246,.92);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:28px;box-shadow:0 24px 70px rgba(95,55,45,.12)}.btn{border:0;border-radius:999px;padding:12px 18px;cursor:pointer;text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:.58rem;background:var(--ink);color:#fff}.btn.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.upload{display:grid;gap:14px}.upload input[type=file]{padding:14px;border:1px dashed var(--line);border-radius:15px;background:white}.status{font-size:.75rem;color:var(--ink2)}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}.photo{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}.photo img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.photo .body{padding:12px}.photo input{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}.photo button{margin-right:5px}@media(max-width:800px){.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.nav{border-radius:20px}.nav a{flex:1;text-align:center}.gallery{grid-template-columns:1fr}.panel{padding:22px}}</style></head><body><main><div class="top"><div><div class="brand"><strong>Autumn</strong><span>Nails</span></div><div class="muted">Private admin · Photos</div></div><button class="btn ghost" onclick="logout()">Log out</button></div><nav class="nav"><a href="/admin/">Home</a><a href="/admin/booking.html">Bookings</a><a href="/admin/clients.html">Clients</a><a class="active" href="/admin/photos.html">Photos</a><a href="/admin/marketing.html">Marketing</a><a href="/admin/finance.html">Payments</a></nav><section class="panel"><div class="upload"><div><div class="kicker">Gallery</div><h1 style="font:400 2rem Georgia,serif;margin:0 0 8px">Upload nail photos</h1><p class="muted">Choose up to 20 photos. They are stored in the existing Autumn Nails image storage and can be captioned for the public gallery.</p></div><input id="files" type="file" accept="image/*" multiple><div><button class="btn" id="upload">Upload selected photos</button> <span class="status" id="status"></span></div></div><div id="gallery" class="gallery"></div></section></main><script>const API="https://autumn-nails-upload.thberry84.workers.dev";const $=id=>document.getElementById(id);function headers(){const token=sessionStorage.getItem("an_booking_admin");return token?{Authorization:"Bearer "+token}:{} }async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){location.href="/admin/";throw Error("Not authorised")};if(!r.ok)throw Error(d.error||"Request failed");return d}async function check(){try{const r=await fetch(API+"/api/session",{headers:headers()});const d=await r.json();if(!d.authenticated)location.href="/admin/";else load()}catch{location.href="/admin/"}}async function load(){try{const d=await api("/api/gallery");const files=d.files||[];$('gallery').innerHTML=files.length?files.map((p,i)=>`<article class="photo"><img src="${esc(p.url)}" alt="${esc(p.caption||'Autumn Nails gallery photo')}" loading="lazy"><div class="body"><input id="cap-${i}" value="${esc(p.caption||'')}" placeholder="Caption"><button class="btn ghost" onclick="save('${esc(p.name)}','${i}')">Save</button> <button class="btn ghost" onclick="removePhoto('${esc(p.name)}')">Delete</button></div></article>`).join(''):'<p class="muted">No gallery photos yet.</p>'}catch(e){$('status').textContent=e.message}}$('upload').onclick=async()=>{const files=[...$('files').files];if(!files.length){$('status').textContent='Choose at least one photo.';return}const fd=new FormData();files.slice(0,20).forEach(f=>fd.append('files',f));$('status').textContent='Uploading…';try{const d=await api('/api/upload',{method:'POST',body:fd});$('status').textContent=`Uploaded ${d.uploaded?.length||files.length} photo(s).`;$('files').value='';load()}catch(e){$('status').textContent=e.message}};window.save=async(name,i)=>{try{await api('/api/gallery/caption',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,caption:$('cap-'+i).value})});$('status').textContent='Caption saved.'}catch(e){$('status').textContent=e.message}};window.removePhoto=async name=>{if(!confirm('Delete this photo from the gallery?'))return;try{await api('/api/gallery/'+encodeURIComponent(name),{method:'DELETE'});load()}catch(e){$('status').textContent=e.message}};function logout(){sessionStorage.removeItem('an_booking_admin');location.href='/admin/'}function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}check();</script></body></html>
