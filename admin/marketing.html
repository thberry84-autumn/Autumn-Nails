<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing | Autumn Nails</title><style>:root{--ink:#64342d;--muted:#80584d;--paper:#fbf3ed;--cream:#fffaf6;--line:rgba(100,52,45,.14);--shadow:0 24px 70px rgba(95,55,45,.12)}*{box-sizing:border-box}html{font-size:18px}body{margin:0;background:linear-gradient(135deg,#f7ebe3,#fcf5f0 46%,#f1dfd4);font-family:Arial,sans-serif;color:var(--ink)}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:20px 0 60px}.topbar{position:sticky;top:16px;z-index:10;background:rgba(255,250,246,.94);backdrop-filter:blur(14px);border:1px solid white;box-shadow:0 16px 38px rgba(90,48,40,.1);border-radius:999px;padding:12px 14px 12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;white-space:nowrap}.brand::before{content:"";display:block;width:126px;height:52px;background:url('/images/autumn-nails-logo.svg?v=20260903') center left/contain no-repeat}.brand strong,.brand span{display:none}.nav{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.nav a{font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;padding:10px 11px;border-radius:999px}.nav a.active,.nav a:hover{background:var(--paper)}.logout{border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:white;color:var(--ink);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;cursor:pointer}main{margin-top:55px}.kicker{font-size:.74rem;text-transform:uppercase;letter-spacing:.23em;color:#a06b59;margin-bottom:10px}h1{font:400 clamp(2.7rem,5vw,4.5rem) Georgia,serif;margin:0 0 8px;letter-spacing:-.045em}.muted{color:var(--muted);line-height:1.6;font-size:1rem}.card{background:rgba(255,250,246,.94);border:1px solid white;border-radius:26px;box-shadow:var(--shadow);padding:24px;margin-top:28px}.count{margin:0 0 18px;font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:.94rem}th{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3e6df;font-size:.72rem}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:900px){.topbar{border-radius:24px;align-items:flex-start}}@media(max-width:650px){.nav{justify-content:flex-start}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><div class="wrap"><header class="topbar"><a class="brand" href="/"><strong>Autumn</strong><span>Nails</span></a><nav class="nav"><a href="/admin/">Home</a><a href="/admin/booking.html">Bookings</a><a href="/admin/clients.html">Clients</a><a href="/admin/photos.html">Photos</a><a class="active" href="/admin/marketing.html">Marketing</a><a href="/admin/finance.html">Payments</a></nav><button class="logout" onclick="sessionStorage.removeItem('an_booking_admin');location.href='/admin/login.html'">Log out</button></header><main><div class="kicker">Permission-based contacts</div><h1>Marketing</h1><p class="muted">Customers who have explicitly opted in to occasional Autumn Nails news, appointment releases and offers.</p><section class="card"><p id="count" class="count">Loading…</p><div id="content"><div class="empty">Loading…</div></div></section></main></div><script>const API='https://autumn-nails-booking.thberry84.workers.dev',token=sessionStorage.getItem('an_booking_admin');async function load(){if(!token){location.href='/admin/login.html';return}const r=await fetch(API+'/api/admin/clients',{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store'});if(r.status===401){location.href='/admin/login.html';return}const d=await r.json();if(!r.ok){document.getElementById('content').innerHTML='<div class="empty">'+esc(d.error||'Unable to load contacts.')+'</div>';return}const rows=(d.clients||[]).filter(c=>c.marketing_opt_in);document.getElementById('count').textContent=rows.length+' opted-in contact'+(rows.length===1?'':'s');document.getElementById('content').innerHTML=rows.length?'<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Opted in</th></tr></thead><tbody>'+rows.map(c=>'<tr><td>'+esc(c.first_name+' '+c.surname)+'</td><td>'+esc(c.email)+'</td><td>'+esc(c.phone)+'</td><td><span class="tag">Yes</span></td></tr>').join('')+'</tbody></table>':'<div class="empty">No customers have opted in yet.</div>'}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}load();</script></body></html>
