<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing contacts | Autumn Nails</title><style>body{margin:0;background:#f7ebe3;font-family:Arial,sans-serif;color:#64342d}main{width:min(950px,calc(100% - 28px));margin:35px auto;background:#fffaf6;padding:30px;border-radius:28px;box-shadow:0 24px 70px rgba(95,55,45,.12)}h1{font:400 2.5rem Georgia,serif}.muted{color:#80584d;line-height:1.6}.bar{display:flex;justify-content:space-between;margin:24px 0}button{border:1px solid #eadbd3;border-radius:999px;padding:11px 18px;background:white;color:#64342d;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:13px;border-bottom:1px solid rgba(100,52,45,.14);font-size:.84rem}th{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em}.empty{padding:25px;text-align:center;color:#80584d}</style></head><body><main><h1>Marketing contacts</h1><p class="muted">Customers who have explicitly opted in to occasional Autumn Nails news, appointment releases and offers.</p><div class="bar"><span id="count" class="muted"></span><button onclick="location.href='/admin/booking.html'">Bookings</button></div><div id="content"><div class="empty">Loading…</div></div></main><script>const API='https://autumn-nails-booking.thberry84.workers.dev',token=localStorage.getItem('autumnAdminToken');async function load(){const r=await fetch(API+'/api/admin/clients',{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});if(r.status===401){location.href='/admin/booking.html';return}const d=await r.json();const rows=(d.clients||[]).filter(c=>c.marketing_opt_in);document.getElementById('count').textContent=`${rows.length} opted-in contact${rows.length===1?'':'s'}`;document.getElementById('content').innerHTML=rows.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Opted in</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(c.first_name+' '+c.surname)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>Yes</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No customers have opted in yet.</div>'}function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}load();</script></body></html>
