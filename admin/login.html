<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autumn Nails — Admin Sign In</title><style>:root{--ink:#64342d;--ink2:#80584d;--paper:#fbf3ed;--cream:#fffaf6;--line:rgba(100,52,45,.14);--shadow:0 24px 70px rgba(95,55,45,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f7ebe3,#fcf5f0 46%,#f1dfd4);display:grid;place-items:center}.panel{width:min(500px,calc(100% - 28px));background:rgba(255,250,246,.94);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);border-radius:30px;padding:34px}.brand{display:inline-flex;align-items:center;white-space:nowrap;margin-bottom:32px}.brand::before{content:"";display:block;width:170px;height:70px;background:url('/images/autumn-nails-logo.svg?v=20260903') center left/contain no-repeat}.kicker{text-transform:uppercase;letter-spacing:.22em;font-size:.6rem;color:#a06b59;margin-bottom:10px}.h{font:400 clamp(2.2rem,6vw,3.1rem) Georgia,serif;letter-spacing:-.04em;margin:0 0 10px}.muted{color:var(--ink2);font-size:.86rem;line-height:1.65}.field{display:grid;gap:7px;margin:18px 0}.field label{text-transform:uppercase;letter-spacing:.14em;font-size:.57rem;color:#956f64}.field input{width:100%;border:1px solid var(--line);border-radius:13px;background:white;padding:14px;color:var(--ink);outline:none}.btn{width:100%;border:0;border-radius:999px;padding:13px 18px;cursor:pointer;text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:.58rem;background:var(--ink);color:#fff}.error{color:#9b3d32;font-size:.74rem;min-height:18px;margin-top:10px}.back{display:inline-block;margin-top:22px;color:var(--ink2);font-size:.65rem;text-transform:uppercase;letter-spacing:.12em}@media(max-width:500px){.panel{padding:26px}.brand::before{width:145px;height:62px}}</style></head><body><main class="panel"><a class="brand" href="/"><span class="sr-only">Autumn Nails</span></a><div class="kicker">Private admin</div><h1 class="h">Welcome back.</h1><p class="muted">Sign in to manage Autumn Nails bookings, clients, photos, marketing and payments.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="loginButton" type="submit">Log in</button><div class="error" id="loginError" aria-live="polite"></div></form><a class="back" href="/">← Back to Autumn Nails</a></main><script>const API='https://autumn-nails-booking.thberry84.workers.dev';const params=new URLSearchParams(location.search),next=params.get('next')||'/admin/';const safeNext=next.startsWith('/admin/')?next:'/admin/';const existing=sessionStorage.getItem('an_booking_admin');if(existing){fetch(API+'/api/session',{headers:{Authorization:'Bearer '+existing},cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.authenticated)location.replace(safeNext)}).catch(()=>{});}const form=document.getElementById('loginForm'),email=document.getElementById('email'),password=document.getElementById('password'),error=document.getElementById('loginError'),button=document.getElementById('loginButton');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';button.disabled=true;button.textContent='Signing in…';try{const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Could not log in.');sessionStorage.setItem('an_booking_admin',d.token);location.replace(safeNext);}catch(e){error.textContent=e.message||'The booking service could not be reached. Please try again.';button.disabled=false;button.textContent='Log in';}});</script></body></html>
