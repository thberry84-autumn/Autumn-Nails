<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clients | Autumn Nails</title><style>:root{--ink:#64342d;--muted:#80584d;--cream:#fffaf6;--accent:#bf7054;--line:rgba(100,52,45,.14)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7ebe3,#fcf5f0 46%,#f1dfd4);font-family:Arial,sans-serif;color:var(--ink)}main{width:min(1050px,calc(100% - 28px));margin:35px auto;background:rgba(255,250,246,.94);padding:30px;border-radius:28px;box-shadow:0 24px 70px rgba(95,55,45,.12)}h1{font:400 2.5rem Georgia,serif;margin:0 0 8px}.muted{color:var(--muted);line-height:1.6}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:24px 0}.btn{border:0;border-radius:999px;padding:12px 18px;background:var(--ink);color:white;font-weight:bold;cursor:pointer}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}input,select{border:1px solid var(--line);border-radius:12px;padding:11px;background:white;color:var(--ink)}.search{width:min(420px,100%)}table{width:100%;border-collapse:collapse;background:white;border-radius:18px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:.84rem}th{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3e6df;font-size:.65rem}.empty{padding:25px;text-align:center;color:var(--muted)}#manual{display:none;margin:22px 0;padding:22px;background:#fff;border:1px solid var(--line);border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><main><h1>Clients</h1><p class="muted">Your online customer records. Consultation and health information is not stored here.</p><div class="bar"><input id="search" class="search" placeholder="Search name, email or phone" autocomplete="off"><div><button class="btn secondary" onclick="location.href='/admin/booking.html'">Bookings</button></div></div><section id="manual"><h2 style="font:400 1.5rem Georgia,serif">Book for a client</h2><div class="grid"><select id="client"></select><select id="service"></select><select id="slot"></select></div><p><button class="btn" id="book">Create booking</button></p><div id="manualError" class="muted"></div></section><div id="content"></div></main><script>const API='https://autumn-nails-booking.thberry84.workers.dev';let token=localStorage.getItem('autumnAdminToken'),clients=[],services=[],slots=[];const $=id=>document.getElementById(id);async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:`Bearer ${token}`,Accept:'application/json','Content-Type':'application/json'};const r=await fetch(API+path,opt);const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin/booking.html';throw Error('Not authorised')}if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const [c,s,a]=await Promise.all([api('/api/admin/clients'),api('/api/services'),api('/api/admin/availability')]);clients=c.clients||[];services=s.services||[];slots=(a.slots||[]).filter(x=>x.status==='available'&&!x.removed_at);render();$('client').innerHTML=clients.map(c=>`<option value="${c.id}">${esc(c.first_name+' '+c.surname)} — ${esc(c.email)}</option>`).join('');$('service').innerHTML=services.map(s=>`<option value="${s.id}">${esc(s.name)} — ${money(s.price)}</option>`).join('');refreshSlots();$('manual').style.display='block'}catch(e){$('content').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}function render(){const q=$('search').value.toLowerCase();const rows=clients.filter(c=>(c.first_name+' '+c.surname+' '+c.email+' '+c.phone).toLowerCase().includes(q));$('content').innerHTML=rows.length?`<table><thead><tr><th>Client</th><th>Contact</th><th>Bookings</th><th>Last booking</th><th>Marketing</th></tr></thead><tbody>${rows.map(c=>`<tr><td><strong>${esc(c.first_name+' '+c.surname)}</strong></td><td>${esc(c.email)}<br>${esc(c.phone)}</td><td>${c.booking_count||0}</td><td>${c.last_booking_date?new Date(c.last_booking_date+'T12:00:00').toLocaleDateString('en-GB'):'—'}</td><td>${c.marketing_opt_in?'<span class="tag">Opted in</span>':'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No clients found.</div>'}function refreshSlots(){const service=$('service').value;const list=slots.filter(s=>{const ids=JSON.parse(s.service_ids_json||'[]');return !ids.length||ids.includes(service)});$('slot').innerHTML=list.map(s=>`<option value="${s.id}">${new Date(s.date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})} · ${s.start_time}–${s.endTime}</option>`).join('')}$('search').oninput=render;$('service').onchange=refreshSlots;$('book').onclick=async()=>{try{const d=await api('/api/admin/manual-booking',{method:'POST',body:JSON.stringify({clientId:$('client').value,serviceId:$('service').value,slotId:Number($('slot').value)})});$('manualError').textContent=`Booked ${d.booking.service} for ${new Date(d.booking.date+'T12:00:00').toLocaleDateString('en-GB')} at ${d.booking.startTime}.`;await load()}catch(e){$('manualError').textContent=e.message}}function money(p){return '£'+(Number(p||0)/100).toFixed(2)}function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}load();</script></body></html>
