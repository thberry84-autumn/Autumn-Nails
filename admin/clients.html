<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clients | Autumn Nails</title>
<style>
:root{--ink:#64342d;--muted:#80584d;--paper:#fbf3ed;--cream:#fffaf6;--line:rgba(100,52,45,.14);--shadow:0 24px 70px rgba(95,55,45,.12)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7ebe3,#fcf5f0 46%,#f1dfd4);font-family:Arial,sans-serif;color:var(--ink)}a{color:inherit;text-decoration:none}.wrap{width:min(1150px,calc(100% - 28px));margin:auto;padding:20px 0 60px}.topbar{position:relative;z-index:10;background:rgba(255,250,246,.96);backdrop-filter:blur(14px);border:1px solid white;box-shadow:0 16px 38px rgba(90,48,40,.1);border-radius:24px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:flex-end;gap:8px;white-space:nowrap}.brand strong{font:400 1.9rem Georgia,serif}.brand span{font-size:.58rem;letter-spacing:.42em;text-transform:uppercase;margin-bottom:7px}.nav{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.nav a{font-size:.58rem;letter-spacing:.11em;text-transform:uppercase;padding:10px 11px;border-radius:999px}.nav a.active,.nav a:hover{background:var(--paper)}.logout,.btn{border:0;border-radius:999px;padding:11px 15px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;font-size:.57rem}.logout{background:white;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:wait}main{margin-top:42px}.kicker{font-size:.62rem;text-transform:uppercase;letter-spacing:.23em;color:#a06b59;margin-bottom:10px}h1{font:400 clamp(2.7rem,5vw,4.5rem) Georgia,serif;letter-spacing:-.045em;margin:0 0 8px}.muted{color:var(--muted);line-height:1.6}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:28px 0}.search{width:min(420px,100%);border:1px solid var(--line);border-radius:999px;padding:12px 15px;background:white;color:var(--ink)}.card{background:rgba(255,250,246,.94);border:1px solid white;border-radius:26px;box-shadow:var(--shadow);padding:24px;margin-bottom:20px}.card h2{font:400 1.6rem Georgia,serif;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:7px}.field label{font-size:.56rem;letter-spacing:.13em;text-transform:uppercase;color:#956f64}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;color:var(--ink)}.check{display:flex;gap:9px;align-items:center;font-size:.75rem;color:var(--muted);margin:14px 0}.check input{width:auto}.form-actions{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.msg{font-size:.74rem;color:var(--muted);min-height:18px}.error{color:#9b3d32}.success{color:#507054}table{width:100%;border-collapse:collapse;background:white;border-radius:18px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:.82rem;vertical-align:top}th{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3e6df;font-size:.62rem}.empty{padding:25px;text-align:center;color:var(--muted)}#manual{display:none}.hidden{display:none!important}.add-card{display:none}.add-card.open{display:block}.title-row{display:flex;justify-content:space-between;gap:12px;align-items:center}.title-row h2{margin:0}.close{background:transparent;border:0;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.1em;font-size:.58rem}@media(max-width:600px){.topbar{display:grid;grid-template-columns:1fr auto;align-items:center}.brand span{display:none}.nav{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav a{text-align:center;padding:9px 4px}.bar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}.card{padding:20px}.form-actions .btn{width:100%}.form-actions .msg{width:100%}table{display:block;overflow:auto;white-space:nowrap}}
</style>
</head>
<body><div class="wrap">
<header class="topbar"><a class="brand" href="/admin/"><strong>Autumn</strong><span>Nails</span></a><nav class="nav"><a href="/admin/">Home</a><a href="/admin/booking.html">Bookings</a><a class="active" href="/admin/clients.html">Clients</a><a href="/admin/photos.html">Photos</a><a href="/admin/marketing.html">Marketing</a><a href="/admin/finance.html">Payments</a></nav><button class="logout" id="logout">Log out</button></header>
<main><div class="kicker">Customer records</div><h1>Clients</h1><p class="muted">View, add and amend contact records. Consultation and health information is not stored here.</p>
<div class="bar"><input id="search" class="search" placeholder="Search name, email or phone" autocomplete="off"><button class="btn" id="addBtn" type="button">Add client</button></div>
<section class="card add-card" id="addCard"><div class="title-row"><h2 id="formTitle">Add client</h2><button class="close" id="closeAdd" type="button">Close</button></div><form id="clientForm"><div class="grid"><div class="field"><label>First name</label><input id="firstName" required autocomplete="given-name"></div><div class="field"><label>Surname</label><input id="surname" required autocomplete="family-name"></div><div class="field"><label>Email</label><input id="clientEmail" type="email" required autocomplete="email"></div><div class="field"><label>Phone</label><input id="phone" type="tel" required autocomplete="tel"></div></div><label class="check"><input id="marketing" type="checkbox"> Customer has opted in to marketing emails</label><div class="form-actions"><button class="btn" id="saveBtn" type="submit">Save client</button><button class="btn secondary" id="cancelBtn" type="button">Cancel</button><span id="formMsg" class="msg"></span></div></form></section>
<section class="card" id="manual"><h2>Book for a client</h2><div class="grid"><div class="field"><label>Client</label><select id="client"></select></div><div class="field"><label>Service</label><select id="service"></select></div><div class="field"><label>Appointment</label><select id="slot"></select></div></div><div class="form-actions"><button class="btn" id="book" type="button">Create booking</button><span id="manualMsg" class="msg"></span></div></section>
<section class="card"><div id="content"><div class="empty">Loading clients…</div></div></section>
</main></div>
<script>
const API='https://autumn-nails-booking.thberry84.workers.dev';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('an_booking_admin'),clients=[],services=[],slots=[],editingId=null;
function api(path,opt={}){const headers=new Headers(opt.headers||{});if(token)headers.set('Authorization','Bearer '+token);headers.set('Accept','application/json');if(opt.body&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');return fetch(API+path,{...opt,headers,cache:'no-store'})}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
function money(p){return '£'+(Number(p||0)/100).toFixed(2)}
function dateText(v){const [y,m,d]=String(v||'').split('-').map(Number);if(!y)return v||'';return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'})}
async function request(path,opt={}){const r=await api(path,opt),d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin/booking.html';throw Error('Not authorised')}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function loadClients(){try{const d=await request('/api/admin/clients');clients=d.clients||[];render()}catch(e){$('content').innerHTML='<div class="empty error">'+esc(e.message)+'</div>'}}
async function loadSupportingData(){try{const [s,a]=await Promise.all([request('/api/services'),request('/api/admin/availability')]);services=s.services||[];slots=(a.slots||[]).filter(x=>x.status==='available'&&!x.removed_at);fillManual();$('manual').style.display='block'}catch(e){$('manualMsg').textContent='Manual booking is unavailable right now.'}}
function load(){loadClients();loadSupportingData()}
function render(){const q=$('search').value.toLowerCase();const rows=clients.filter(c=>(c.first_name+' '+c.surname+' '+c.email+' '+c.phone).toLowerCase().includes(q));$('content').innerHTML=rows.length?'<table><thead><tr><th>Client</th><th>Contact</th><th>Bookings</th><th>Last booking</th><th>Marketing</th><th></th></tr></thead><tbody>'+rows.map(c=>'<tr><td><strong>'+esc(c.first_name+' '+c.surname)+'</strong></td><td>'+esc(c.email)+'<br>'+esc(c.phone)+'</td><td>'+Number(c.booking_count||0)+'</td><td>'+esc(c.last_booking_date?dateText(c.last_booking_date):'—')+'</td><td>'+(c.marketing_opt_in?'<span class="tag">Opted in</span>':'—')+'</td><td><button class="btn secondary" onclick="openEdit(\''+esc(c.id)+'\')">Edit</button> <button class="btn" onclick="bookClient(\''+esc(c.id)+'\')">Book</button></td></tr>').join('')+'</tbody></table>':'<div class="empty">No clients found.</div>'}
function fillManual(){const selected=$('client').value;$('client').innerHTML=clients.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.first_name+' '+c.surname)+' — '+esc(c.email)+'</option>').join('');if(selected)$('client').value=selected;$('service').innerHTML=services.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+' — '+money(s.price)+'</option>').join('');refreshSlots()}
function refreshSlots(){const sid=$('service').value,list=slots.filter(s=>{let ids=[];try{ids=JSON.parse(s.service_ids_json||'[]')}catch{}return !ids.length||ids.includes(sid)});$('slot').innerHTML=list.map(s=>'<option value="'+s.id+'">'+dateText(s.date)+' · '+esc(s.start_time)+'–'+esc(s.endTime||'')+'</option>').join('')||'<option value="">No available slots</option>'}
function openForm(client){editingId=client?.id||null;$('formTitle').textContent=editingId?'Amend client':'Add client';$('firstName').value=client?.first_name||'';$('surname').value=client?.surname||'';$('clientEmail').value=client?.email||'';$('phone').value=client?.phone||'';$('marketing').checked=Boolean(client?.marketing_opt_in);$('formMsg').textContent='';$('formMsg').className='msg';$('addCard').classList.add('open');$('firstName').focus();$('addCard').scrollIntoView({behavior:'smooth',block:'start'})}
window.openEdit=id=>{const c=clients.find(x=>x.id===id);if(c)openForm(c)};window.bookClient=id=>{$('client').value=id;$('manual').scrollIntoView({behavior:'smooth',block:'start'})};
$('addBtn').onclick=()=>openForm();$('closeAdd').onclick=()=>{$('addCard').classList.remove('open');editingId=null};$('cancelBtn').onclick=()=>$('closeAdd').click();$('search').oninput=render;$('service').onchange=refreshSlots;$('logout').onclick=()=>{sessionStorage.removeItem('an_booking_admin');location.href='/admin/booking.html'};
$('clientForm').onsubmit=async e=>{e.preventDefault();const save=$('saveBtn');save.disabled=true;save.textContent='Saving…';$('formMsg').textContent='';const body={firstName:$('firstName').value.trim(),surname:$('surname').value.trim(),email:$('clientEmail').value.trim(),phone:$('phone').value.trim(),marketingOptIn:$('marketing').checked};try{await request(editingId?'/api/admin/clients/'+encodeURIComponent(editingId):'/api/admin/clients',{method:editingId?'PATCH':'POST',body:JSON.stringify(body)});$('formMsg').textContent='Client saved successfully.';$('formMsg').className='msg success';setTimeout(()=>{$('addCard').classList.remove('open');editingId=null;loadClients();},350)}catch(e){$('formMsg').textContent=e.message;$('formMsg').className='msg error'}finally{save.disabled=false;save.textContent='Save client'}};
$('book').onclick=async()=>{if(!$('slot').value){$('manualMsg').textContent='Please choose an available appointment.';return}try{const d=await request('/api/admin/manual-booking',{method:'POST',body:JSON.stringify({clientId:$('client').value,serviceId:$('service').value,slotId:Number($('slot').value)})});$('manualMsg').textContent='Booked '+d.booking.service+' for '+dateText(d.booking.date)+' at '+d.booking.startTime+'.';load()}catch(e){$('manualMsg').textContent=e.message}};
load();
</script></body></html>
