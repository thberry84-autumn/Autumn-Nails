name: One-time booking calendar fix

on:
  push:
    paths:
      - '.github/booking-calendar-fix.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply calendar and cancellation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('cloudflare-booking-worker/src/index-duration.js')
          s = p.read_text()
          old = 'const row = await env.DB.prepare("SELECT id,date,start_time,status,booked_service_id,selected_services_json FROM bookings WHERE id=? LIMIT 1").bind(id).first();'
          new = 'const row = await env.DB.prepare("SELECT b.id,b.date,b.start_time,b.status,b.booked_service_id,b.selected_services_json,c.first_name,c.surname FROM bookings b JOIN clients c ON c.id=b.client_id WHERE b.id=? LIMIT 1").bind(id).first();'
          if old not in s: raise SystemExit('Expected calendar event query not found')
          s = s.replace(old, new, 1)
          old = 'const summary = `Autumn Nails – ${names.join(" + ")}`;'
          new = 'const customerName = `${String(row.first_name || "").trim()} ${String(row.surname || "").trim()}`.trim();\n  const summary = customerName ? `Autumn Nails – ${customerName} – ${names.join(" + ")}` : `Autumn Nails – ${names.join(" + ")}`;'
          if old not in s: raise SystemExit('Expected calendar event summary not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('cloudflare-booking-worker/src/index.js')
          s = p.read_text()
          old = 'const SITE_ORIGINS = new Set(["https://autumnnails.com", "https://www.autumnnails.com"]);'
          new = 'import { durationForServices, addMinutesToTime } from "./duration-config.js";\n\nconst SITE_ORIGINS = new Set(["https://autumnnails.com", "https://www.autumnnails.com"]);'
          if old not in s: raise SystemExit('Expected index.js header not found')
          s = s.replace(old, new, 1)
          old = 'const result = await env.DB.prepare("SELECT b.id,b.date,b.start_time,b.status,b.booked_service_id,c.first_name FROM bookings b JOIN clients c ON c.id=b.client_id WHERE b.status IN (\'confirmed\',\'completed\') ORDER BY b.date,b.start_time").all();'
          new = 'const result = await env.DB.prepare("SELECT b.id,b.date,b.start_time,b.status,b.booked_service_id,c.first_name,c.surname FROM bookings b JOIN clients c ON c.id=b.client_id WHERE b.status IN (\'confirmed\',\'completed\') ORDER BY b.date,b.start_time").all();'
          if old not in s: raise SystemExit('Expected calendar feed query not found')
          s = s.replace(old, new, 1)
          old = 'const events=(result.results||[]).map(row=>["BEGIN:VEVENT",`UID:booking-${row.id}@autumnnails.com`,`DTSTAMP:${stamp}Z`,`DTSTART;TZID=Europe/London:${toIcsDateTime(row.date,row.start_time)}`,`SUMMARY:${escapeIcs(`Autumn Nails – ${row.first_name}`)}`,`DESCRIPTION:${escapeIcs(serviceName(row.booked_service_id))}`,"END:VEVENT"].join("\\r\\n"));'
          new = 'const events=(result.results||[]).map(row=>{const customerName=`${String(row.first_name||"").trim()} ${String(row.surname||"").trim()}`.trim(),duration=durationForServices([row.booked_service_id]),endTime=addMinutesToTime(row.start_time,duration);return ["BEGIN:VEVENT",`UID:booking-${row.id}@autumnnails.com`,`DTSTAMP:${stamp}Z`,`DTSTART;TZID=Europe/London:${toIcsDateTime(row.date,row.start_time)}`,`DTEND;TZID=Europe/London:${toIcsDateTime(row.date,endTime)}`,`SUMMARY:${escapeIcs(customerName ? `Autumn Nails – ${customerName}` : `Autumn Nails – ${serviceName(row.booked_service_id)}`)}`,`DESCRIPTION:${escapeIcs(serviceName(row.booked_service_id))}`,"END:VEVENT"].join("\\r\\n")});'
          if old not in s: raise SystemExit('Expected calendar feed event builder not found')
          s = s.replace(old, new, 1)
          old = '"CALSCALE:GREGORIAN","X-WR-CALNAME:Autumn Nails",...events,'
          new = '"CALSCALE:GREGORIAN","X-WR-CALNAME:Autumn Nails","REFRESH-INTERVAL;VALUE=DURATION:PT15M","X-PUBLISHED-TTL:PT15M",...events,'
          if old not in s: raise SystemExit('Expected calendar feed header not found')
          s = s.replace(old, new, 1)
          old = 'const result = await env.DB.prepare("SELECT b.id,b.date,b.start_time,b.price_pence,b.status,b.service_id,b.booked_service_id,b.addons_json,c.first_name,c.surname,c.email,c.phone FROM bookings b JOIN clients c ON c.id=b.client_id ORDER BY b.date DESC,b.start_time DESC").all();'
          new = 'const result = await env.DB.prepare("SELECT b.id,b.date,b.start_time,b.price_pence,b.status,b.service_id,b.booked_service_id,b.addons_json,c.first_name,c.surname,c.email,c.phone FROM bookings b JOIN clients c ON c.id=b.client_id WHERE b.status IN (\'confirmed\',\'completed\') ORDER BY b.date DESC,b.start_time DESC").all();'
          if old not in s: raise SystemExit('Expected admin booking query not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          Path('.github/booking-calendar-fix.trigger').unlink(missing_ok=True)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-booking-worker/src/index.js cloudflare-booking-worker/src/index-duration.js .github/booking-calendar-fix.trigger
          git diff --cached --quiet && exit 0
          git commit -m 'Fix booking calendar and cancellation display'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only
          rm -f .github/workflows/one-time-booking-calendar-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-booking-calendar-fix.yml
          git diff --cached --quiet || (git commit -m 'Remove one-time booking calendar fix workflow' && git push)
