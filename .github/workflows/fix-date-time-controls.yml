name: Fix UK date and time controls
on:
  workflow_dispatch:
  push:
    paths:
      - 'repair-date-time.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'admin/booking.html';
            const current = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            const sha = current.data.sha;
            let html = Buffer.from(current.data.content, 'base64').toString('utf8');
            const controls = '<div class="field"><label for="dateUk">Date</label><div class="picker-wrap"><input id="dateUk" class="picker-display" type="text" inputmode="numeric" autocomplete="off" placeholder="DD/MM/YY" aria-describedby="dateHelp" readonly><input id="datePicker" class="native-picker" type="date" tabindex="-1" aria-hidden="true"></div></div><div class="field"><label for="timeDisplay">Time</label><div class="picker-wrap"><input id="timeDisplay" class="picker-display" type="text" inputmode="numeric" autocomplete="off" placeholder="HH:MM" readonly><input id="time" class="native-picker" type="time" tabindex="-1" aria-hidden="true"></div></div>';
            if (!html.includes('id="datePicker"')) {
              const old = '<div class="field"><label for="dateUk">Date</label><input id="dateUk" class="date-uk" type="date" aria-describedby="dateHelp"></div><div class="field"><label>Time</label><input id="time" type="time"></div>';
              if (!html.includes(old)) core.setFailed('Date/time controls not found');
              html = html.replace(old, controls);
            }
            html = html.replace(/function parseUkDate\(value\)\{[\s\S]*?\}\nfunction timeText/, 'function parseUkDate(value){const raw=String(value||"").trim();const match=/^(\\d{2})\\/(\\d{2})\\/(\\d{2})$/.exec(raw);if(!match)return null;const d=Number(match[1]),m=Number(match[2]),yy=Number(match[3]),y=2000+yy,dt=new Date(Date.UTC(y,m-1,d));if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)return null;return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`}\nfunction timeText');
            if (!html.includes('function formatUkShort')) {
              const marker = '$("logout").onclick=()=>{sessionStorage.removeItem("an_booking_admin");location.reload()};';
              const pickerJs = 'function formatUkShort(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return `${d}/${m}/${String(y).slice(-2)}`}function openPicker(id){const el=$(id);try{if(typeof el.showPicker==="function")el.showPicker();else el.click()}catch{el.focus()}}$("dateUk").onclick=()=>openPicker("datePicker");$("datePicker").onchange=()=>{$("dateUk").value=formatUkShort($("datePicker").value)};$("timeDisplay").onclick=()=>openPicker("time");$("time").onchange=()=>{$("timeDisplay").value=$("time").value||""};';
              html = html.replace(marker, marker + pickerJs);
            }
            html = html.replace('Please enter a valid date (DD/MM/YYYY) and time.', 'Please choose a valid date (DD/MM/YY) and time.');
            html = html.replace('Choose the date using the calendar. It will display in your UK date format (DD/MM/YY).', 'Choose the date or time using the picker. Dates are shown in UK format (DD/MM/YY).');
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path, message: 'Fix UK date display and time picker controls', content: Buffer.from(html).toString('base64'), sha, branch: 'main'});
            const wf = await github.rest.repos.getContent({owner, repo, path: '.github/workflows/fix-date-time-controls.yml', ref: 'main'});
            await github.rest.repos.deleteFile({owner, repo, path: '.github/workflows/fix-date-time-controls.yml', message: 'Remove temporary date time repair workflow', sha: wf.data.sha, branch: 'main'});
            const trigger = await github.rest.repos.getContent({owner, repo, path: 'repair-date-time.trigger', ref: 'main'});
            await github.rest.repos.deleteFile({owner, repo, path: 'repair-date-time.trigger', message: 'Remove temporary repair trigger', sha: trigger.data.sha, branch: 'main'});