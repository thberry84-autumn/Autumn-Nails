name: Deploy Autumn Nails Studio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-studio-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy Studio Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-studio-worker
          command: deploy

  deploy-studio-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy Studio API
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-studio-api
          command: deploy

      - name: Set Studio API GitHub secret
        working-directory: cloudflare-studio-api
        env:
          STUDIO_GITHUB_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN }}
        run: |
          if [ -z "$STUDIO_GITHUB_TOKEN" ]; then
            echo "STUDIO_GITHUB_TOKEN is not configured; leaving the Worker deployed but without its GitHub captions secret."
            exit 0
          fi
          printf '%s' "$STUDIO_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
