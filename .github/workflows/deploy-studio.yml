name: Deploy Autumn Nails Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-studio-worker/**'
      - 'cloudflare-studio-api/**'
      - '.github/workflows/deploy-studio.yml'

permissions:
  contents: read

jobs:
  deploy-studio-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Wrangler
        working-directory: cloudflare-studio-worker
        run: npm install --no-save wrangler@4.127.1

      - name: Check Studio Worker JavaScript syntax
        working-directory: cloudflare-studio-worker
        run: node --check src/entry.js

      - name: Deploy Studio Worker
        working-directory: cloudflare-studio-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4.127.1 deploy

  deploy-studio-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Wrangler
        working-directory: cloudflare-studio-api
        run: npm install --no-save wrangler@4.127.1

      - name: Check Studio API JavaScript syntax
        working-directory: cloudflare-studio-api
        run: |
          node --check src/entry.js
          node --check src/index.js
          node --check src/booking-status.js
          node --check src/availability-edit.js
          node --check src/studio-actions.js

      - name: Prepare Studio API secrets
        working-directory: cloudflare-studio-api
        env:
          STUDIO_GITHUB_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN }}
        run: |
          if [ -z "$STUDIO_GITHUB_TOKEN" ]; then
            echo "STUDIO_GITHUB_TOKEN is not configured."
            exit 1
          fi
          umask 077
          printf 'GITHUB_TOKEN=%s\n' "$STUDIO_GITHUB_TOKEN" > .studio-secrets

      - name: Deploy Studio API
        working-directory: cloudflare-studio-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4.127.1 deploy --secrets-file .studio-secrets

      - name: Remove temporary Studio API secrets file
        if: always()
        working-directory: cloudflare-studio-api
        run: rm -f .studio-secrets
