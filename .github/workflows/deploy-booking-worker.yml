name: Deploy Autumn Nails Booking Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-booking-worker/**"
      - ".github/workflows/deploy-booking-worker.yml"
  pull_request:
    paths:
      - "cloudflare-booking-worker/**"
      - ".github/workflows/deploy-booking-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: d94904809c2530355a903bbeb3306c03

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-booking-worker
    steps:
      - name: Check out Worker source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-booking-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Worker regression tests
        run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current Worker source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-booking-worker
          command: d1 migrations apply autumn-nails-booking --remote
      - name: Deploy current Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-booking-worker
          command: deploy
