name: Deploy Autumn Nails Booking Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-booking-worker/**"
      - ".github/workflows/deploy-booking-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy booking Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-booking-worker
          command: deploy
