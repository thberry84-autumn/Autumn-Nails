name: Deploy Autumn Nails Booking Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-booking-worker/**"
      - ".github/workflows/deploy-booking-worker.yml"
  pull_request:
    paths:
      - "cloudflare-booking-worker/**"
      - ".github/workflows/deploy-booking-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: d94904809c2530355a903bbeb3306c03

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current Worker source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Wrangler
        working-directory: cloudflare-booking-worker
        run: npm install --no-save wrangler@4.127.1
      - name: Check Worker JavaScript syntax
        working-directory: cloudflare-booking-worker
        run: |
          node --check src/index-cancel.js
          node --check src/index-production.js
          node --check src/index-duration.js
          node --check src/index-history.js
          node --check src/index-multi-calendar.js
          node --check src/index-multi.js
          node --check src/index-snagging.js
          node --check src/index-calendar.js
          node --check src/index.js
          node --check src/duration-config.js
      - name: Apply D1 migrations
        working-directory: cloudflare-booking-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4.127.1 d1 migrations apply autumn-nails-booking --remote
      - name: Deploy current Worker
        working-directory: cloudflare-booking-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4.127.1 deploy
