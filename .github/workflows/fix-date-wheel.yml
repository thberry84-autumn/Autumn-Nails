name: Fix admin date picker wheel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-date-wheel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add date wheel picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/booking.html')
          s=p.read_text()
          old='''<div class="field"><label for="dateUk">Date</label><div class="picker-wrap"><input id="dateUk" class="picker-display" type="text" inputmode="numeric" autocomplete="off" placeholder="DD/MM/YY" aria-describedby="dateHelp" readonly><input id="datePicker" class="native-picker" type="date" tabindex="-1" aria-hidden="true"></div></div>'''
          new='''<div class="field"><label for="dateUk">Date</label><div class="picker-wrap"><input id="dateUk" class="picker-display" type="text" inputmode="numeric" autocomplete="off" placeholder="DD/MM/YY" aria-describedby="dateHelp" readonly><input id="datePicker" class="native-picker" type="date" tabindex="-1" aria-hidden="true"><div id="dateWheel" class="time-wheel hidden" role="dialog" aria-label="Choose appointment date"><div class="time-wheel-title">Choose a date</div><div class="wheel-row date-wheels"><div class="wheel-col" id="dayWheel"></div><div class="wheel-col month" id="monthWheel"></div><div class="wheel-col year" id="yearWheel"></div></div><div class="time-wheel-actions"><button id="dateCancel" class="btn ghost" type="button">Cancel</button><button id="dateDone" class="btn primary" type="button">Done</button></div></div></div></div>'''
          if old not in s: raise SystemExit('Date field pattern not found')
          s=s.replace(old,new,1)
          css='''.date-wheels{grid-template-columns:.8fr 1.5fr 1fr}.wheel-col.month,.wheel-col.year{font-size:.95rem}'''
          s=s.replace('</style>',css+'\n</style>',1)
          start=s.index('function formatUkShort(')
          end=s.index('async function loadServices()',start)
          replacement='''function formatUkShort(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return `${d}/${m}/${String(y).slice(-2)}`}function resetNativePicker(el,handler,value){const fresh=el.cloneNode(true);el.replaceWith(fresh);fresh.value=value||"";fresh.addEventListener("change",handler);return fresh}function datePickerChanged(e){const el=e.currentTarget,value=el.value;$("dateUk").value=formatUkShort(value);resetNativePicker(el,datePickerChanged,value)}
          const dateMonths=["January","February","March","April","May","June","July","August","September","October","November","December"];let dateDraft="";
          function wheelItems(id,values,current){const el=$(id);el.innerHTML=values.map(v=>`<div class="wheel-item${String(v)===String(current)?' selected':''}" data-value="${v}">${v}</div>`).join("");el.querySelectorAll('.wheel-item').forEach(item=>item.onclick=()=>{el.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));item.classList.add('selected');item.scrollIntoView({block:'center',behavior:'smooth'})});}
          function wheelValue(id){const el=$(id),box=el.getBoundingClientRect(),center=box.top+box.height/2;let best=null,dist=Infinity;el.querySelectorAll('.wheel-item').forEach(item=>{const r=item.getBoundingClientRect(),d=Math.abs((r.top+r.height/2)-center);if(d<dist){dist=d;best=item}});return best?.dataset.value||""}
          function scrollWheelTo(id,value){const el=$(id),item=[...el.querySelectorAll('.wheel-item')].find(x=>x.dataset.value===String(value));if(item)item.scrollIntoView({block:'center'});}
          function daysInMonth(y,m){return new Date(y,m,0).getDate()}
          function buildDateWheel(value){let y=Number(value?.split('-')[0])||new Date().getFullYear(),m=Number(value?.split('-')[1])||new Date().getMonth()+1,d=Number(value?.split('-')[2])||new Date().getDate();const years=Array.from({length:7},(_,i)=>y-1+i);wheelItems('dayWheel',Array.from({length:daysInMonth(y,m)},(_,i)=>String(i+1).padStart(2,'0')),String(Math.min(d,daysInMonth(y,m))).padStart(2,'0'));wheelItems('monthWheel',dateMonths.map((x,i)=>String(i+1).padStart(2,'0')+' '+x),String(m).padStart(2,'0')+' '+dateMonths[m-1]);wheelItems('yearWheel',years,String(y));requestAnimationFrame(()=>{scrollWheelTo('dayWheel',String(Math.min(d,daysInMonth(y,m))).padStart(2,'0'));scrollWheelTo('monthWheel',String(m).padStart(2,'0')+' '+dateMonths[m-1]);scrollWheelTo('yearWheel',String(y))})}
          function openDateWheel(){dateDraft=$("datePicker").value||new Date().toISOString().slice(0,10);buildDateWheel(dateDraft);$("dateWheel").classList.remove("hidden");}
          function closeDateWheel(){$("dateWheel").classList.add("hidden");}
          function commitDateWheel(){const y=Number(wheelValue('yearWheel')),mv=wheelValue('monthWheel'),m=Number(mv.slice(0,2)),d=Number(wheelValue('dayWheel'));if(!y||!m||!d)return;const dd=Math.min(d,daysInMonth(y,m)),value=`${y}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;$("datePicker").value=value;$("dateUk").value=formatUkShort(value);closeDateWheel();}
          $("dateUk").onclick=openDateWheel;$("dateDone").onclick=commitDateWheel;$("dateCancel").onclick=closeDateWheel;document.addEventListener('click',e=>{if(!$("dateWheel").contains(e.target)&&e.target!==$("dateUk"))closeDateWheel();if(!$("timeWheel").contains(e.target)&&e.target!==$("timeDisplay"))closeTimeWheel()});
          '''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
      - name: Verify JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('admin/booking.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          Path('/tmp/booking.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/booking.js
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/booking.html
          git rm .github/workflows/fix-date-wheel.yml
          git commit -m "Add spinning date picker" || exit 0
          git push
