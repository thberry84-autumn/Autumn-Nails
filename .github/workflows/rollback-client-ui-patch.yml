name: Roll back client UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-client-ui-patch.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Remove injected client UI enhancement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin/clients.html')
          text = p.read_text()
          start = text.find('/* ADMIN_UI_ENHANCEMENTS_START */')
          end = text.find('/* ADMIN_UI_ENHANCEMENTS_END */', start)
          if start < 0 or end < 0:
              raise SystemExit('Enhancement markers not found')
          end += len('/* ADMIN_UI_ENHANCEMENTS_END */')
          p.write_text(text[:start] + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/clients.html
          git commit -m "Fix clients screen loading"
          git push
