name: Booking Worker Tests

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-booking-worker/**"
      - ".github/workflows/test-booking-worker.yml"
  pull_request:
    paths:
      - "cloudflare-booking-worker/**"
      - ".github/workflows/test-booking-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-booking-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Check production Worker JavaScript syntax
        run: |
          node --check src/index-cancel.js
          node --check src/index-production.js
          node --check src/index-duration.js
          node --check src/index-history.js
          node --check src/index-multi-calendar.js
          node --check src/index-multi.js
          node --check src/index-snagging.js
          node --check src/index-calendar.js
          node --check src/index-phase4.js
          node --check src/index-phase3.js
          node --check src/index-email.js
          node --check src/index-v2.js
          node --check src/duration-config.js
      - name: Run Vitest regression suite
        run: npm test
