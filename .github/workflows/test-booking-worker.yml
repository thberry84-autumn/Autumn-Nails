name: Booking Worker Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-booking-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: |
          node --check src/index-production.js
          node --check src/index-duration.js
          node --check src/index-history.js
          node --check src/index-multi-calendar.js
          node --check src/index-multi.js
          node --check src/index-snagging.js
          node --check src/index-calendar.js
          node --check src/index.js
          node --check src/duration-config.js
