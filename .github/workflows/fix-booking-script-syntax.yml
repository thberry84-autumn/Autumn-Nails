name: Fix booking script syntax
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove stray escaped newlines from booking script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/booking.html')
          s=p.read_text()
          old=s
          s=s.replace('\\\\n\\\\n', '')
          s=s.replace('\\\\n', '')
          if s == old:
            print('No stray escaped newline sequences found')
          else:
            p.write_text(s)
            print('Removed stray escaped newline sequences')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/booking.html
          git diff --cached --quiet && { git rm .github/workflows/fix-booking-script-syntax.yml; git commit -m 'Remove temporary booking syntax fix workflow'; git push; exit 0; }
          git commit -m 'Fix booking admin script syntax'
          git rm .github/workflows/fix-booking-script-syntax.yml
          git commit -m 'Remove temporary booking syntax fix workflow'
          git push