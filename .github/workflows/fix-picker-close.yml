name: Fix picker close
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-picker-close.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'admin/booking.html';
            const r = await github.rest.repos.getContent({owner,repo,path,ref:'main'});
            const text = Buffer.from(r.data.content,'base64').toString('utf8');
            let out = text;
            const oldDate = '$("datePicker").onchange=()=>{$("dateUk").value=formatUkShort($("datePicker").value)};';
            const newDate = '$("datePicker").onchange=()=>{const el=$("datePicker");$("dateUk").value=formatUkShort(el.value);setTimeout(()=>el.blur(),0)};';
            const oldTime = '$("time").onchange=()=>{$("timeDisplay").value=$("time").value||""};';
            const newTime = '$("time").onchange=()=>{const el=$("time");$("timeDisplay").value=el.value||"";setTimeout(()=>el.blur(),0)};';
            if(!out.includes(oldDate)) core.setFailed('Expected date picker handler not found');
            if(!out.includes(oldTime)) core.setFailed('Expected time picker handler not found');
            out = out.replace(oldDate,newDate).replace(oldTime,newTime);
            if(out === text) core.setFailed('No changes made');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:'Fix picker close behaviour',content:Buffer.from(out).toString('base64'),sha:r.data.sha,branch:'main'});
            core.info('Updated picker handlers so the native picker loses focus after selection.');