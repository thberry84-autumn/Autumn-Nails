name: Fix admin login click handling
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-login.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make login button non-submitting and click-driven
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/booking.html')
          s=p.read_text()
          old='<button class="btn primary full" type="submit">Log in</button>'
          new='<button id="loginButton" class="btn primary full" type="button">Log in</button>'
          s=s.replace(old,new)
          old_js='$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").textContent="";try{const r=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});const d=await r.json();if(!r.ok){$("loginError").textContent=d.error||"Could not log in.";return}sessionStorage.setItem("an_booking_admin",d.token);show()}catch{$("loginError").textContent="The booking service could not be reached. Please try again.";}};'
          new_js='async function loginAdmin(){$("loginError").textContent="";try{const r=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});const d=await r.json();if(!r.ok){$("loginError").textContent=d.error||"Could not log in.";return}sessionStorage.setItem("an_booking_admin",d.token);show()}catch{$("loginError").textContent="The booking service could not be reached. Please try again.";}}\n$("loginButton").onclick=loginAdmin;\n$("loginForm").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();loginAdmin()}});'
          if old in s: s=s.replace(old,new)
          if old_js in s: s=s.replace(old_js,new_js)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/booking.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix admin login click handling'
          git push
