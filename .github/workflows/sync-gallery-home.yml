name: Sync gallery to homepage

on:
  push:
    branches: [main]
    paths:
      - 'images/nails/captions.json'
      - 'images/nails/**'
      - '.github/workflows/sync-gallery-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Update homepage gallery from GitHub images
        run: |
          python - <<'PY'
          import json, html, re
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          captions_path = Path('images/nails/captions.json')
          try:
              captions = json.loads(captions_path.read_text(encoding='utf-8')) if captions_path.exists() else {}
          except Exception:
              captions = {}

          image_files = [
              p for p in Path('images/nails').iterdir()
              if p.is_file() and re.search(r'\.(jpe?g|png|webp)$', p.name, re.I)
          ]
          image_files.sort(key=lambda p: p.name, reverse=True)

          # Keep the homepage hero tied to the gallery's explicit homepage selection.
          homepage = captions.get('_homepage', '')
          valid_names = {p.name for p in image_files}
          if homepage not in valid_names:
              homepage = image_files[0].name if image_files else ''
          if homepage:
              hero_caption = html.escape(str(captions.get(homepage, '')).strip() or 'Recent Autumn Nails nail set', quote=True)
              hero_src = html.escape(f'/images/nails/{homepage}', quote=True)
              hero_pattern = r'(<div class="hero-photo"><img id="homeHeroPhoto" src=")[^"]*(" alt=")[^"]*(" fetchpriority="high">)'
              text, hero_count = re.subn(hero_pattern, rf'\g<1>{hero_src}\g<2>{hero_caption}\g<3>', text, count=1)
              if hero_count != 1:
                  raise SystemExit('Could not find homepage hero image in index.html')

          slides = []
          for image in image_files:
              filename = image.name
              caption = str(captions.get(filename, '')).strip()
              title = html.escape(caption or 'Recent set', quote=True)
              safe_src = html.escape(f'images/nails/{filename}', quote=True)
              slides.append(f'<div class="gallery-slide"><img src="{safe_src}" alt="{title}"><div class="gallery-title">{title}</div></div>')

          if not slides:
              slides = ['<div class="gallery-slide"><div class="gallery-title">No recent sets yet</div></div>']

          new_section = '''<section class="section alt" id="recent"><div class="wrap"><div class="section-head"><div><div class="kicker">Fresh from the nail desk</div><h2>Recent sets</h2></div><p>A little look at recent Autumn Nails work. More sets can be added to the carousel as the gallery grows.</p></div><div class="gallery" aria-label="Recent nail sets carousel"><div class="gallery-carousel" id="nailCarousel"><div class="gallery-track" id="nailTrack">''' + ''.join(slides) + '''</div><div class="gallery-controls"><button class="gallery-arrow" type="button" id="nailPrev" aria-label="Previous nail set">‹</button><button class="gallery-arrow" type="button" id="nailNext" aria-label="Next nail set">›</button></div></div><div class="gallery-dots" id="nailDots" aria-label="Choose a nail set"></div></div></div></section>'''

          text, n = re.subn(r'<section class="section alt" id="recent">.*?</section>', new_section, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not find Recent sets section in index.html')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage update
        run: |
          git config user.name 'Autumn Nails Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Homepage already up to date.'
          else
            git commit -m 'Sync selected homepage photo and recent gallery'
            git push
          fi
