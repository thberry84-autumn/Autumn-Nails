name: Repair clients page script

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-clients-script-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stray escaped newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("admin/clients.html")
          s = p.read_text()
          marker = "\\\\n\\\\n"
          if marker in s:
              s = s.replace(marker, "")
          p.write_text(s)
          PY
      - name: Verify JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("admin/clients.html").read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          Path('/tmp/clients.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/clients.js
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/clients.html .github/workflows/fix-clients-script.yml .github/workflows/fix-clients-script-v2.yml
          git rm .github/workflows/fix-clients-script.yml 2>/dev/null || true
          git rm .github/workflows/fix-clients-script-v2.yml
          git commit -m "Fix clients page JavaScript" || exit 0
          git push
