name: Add Admin link to public navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-admin-menu.yml'

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add Admin link to public pages
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text()
              old = 'href="/contact.html">Contact</a>'
              new = old + '<a href="/admin/booking.html">Admin</a>'
              if old in text and '<a href="/admin/booking.html">Admin</a>' not in text:
                  path.write_text(text.replace(old, new))
                  changed.append(str(path))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit navigation update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No navigation changes needed.'
          else
            git commit -m 'Add Admin link to public navigation'
            git push
          fi
