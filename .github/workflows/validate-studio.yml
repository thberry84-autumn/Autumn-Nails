name: Validate Autumn Nails Studio

on:
  pull_request:
    paths:
      - 'cloudflare-studio-worker/**'
      - 'cloudflare-studio-api/**'
      - '.github/workflows/validate-studio.yml'
  push:
    branches-ignore:
      - main
    paths:
      - 'cloudflare-studio-worker/**'
      - 'cloudflare-studio-api/**'
      - '.github/workflows/validate-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check Studio Worker JavaScript syntax
        working-directory: cloudflare-studio-worker
        run: node --check src/index.js

      - name: Check Studio API JavaScript syntax
        working-directory: cloudflare-studio-api
        run: |
          for file in src/*.js; do
            node --check "$file"
          done

      - name: Check Studio public JavaScript syntax
        working-directory: cloudflare-studio-worker
        run: |
          set -euo pipefail
          for file in public/*.js; do
            node --check "$file"
          done

      - name: Check inline Studio JavaScript syntax
        working-directory: cloudflare-studio-worker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          html = Path('public/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No inline Studio scripts found')
          for index, script in enumerate(scripts, 1):
              path = Path(f'/tmp/studio-inline-{index}.js')
              path.write_text(script, encoding='utf-8')
              subprocess.run(['node', '--check', str(path)], check=True)
          print(f'Checked {len(scripts)} inline Studio script(s).')
          PY

      - name: Validate canonical Studio page
        working-directory: cloudflare-studio-worker
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          grep -Fq '<section id="studioCalendar"' public/index.html
          grep -Fq 'href="/studio.css?v=20260904i"' public/index.html
          grep -Fq 'href="/studio-payment-amend.css?v=20260904b"' public/index.html
          for asset in \
            studio-actions.js \
            studio-calendar.js \
            studio-booking-fixes.js \
            studio-finance.js \
            studio-clients.js \
            studio-availability-fix.js; do
            grep -Fq "src=\"/$asset" public/index.html
            test -s "public/$asset"
          done
          for asset in \
            studio-gallery.js \
            studio-gallery-upload.js; do
            test -s "public/$asset"
          done
          grep -Fq "studio-gallery.js" public/studio-finance.js
          grep -Fq "studio-gallery-upload.js" public/studio-finance.js

      - name: Confirm Worker no longer performs HTML surgery
        working-directory: cloudflare-studio-worker
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'replace(/<section id="bookings"' src/index.js
          ! grep -Fq 'studioCalendarShell' src/index.js
          ! grep -Fq 'MutationObserver' src/index.js
          ! grep -Fq 'studio-availability-fix.js' src/index.js
