name: Apply admin UI enhancements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-admin-ui-enhancements.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Patch admin booking and client history UI
        run: |
          python - <<'PY'
          from pathlib import Path

          booking = Path('admin/booking.html')
          clients = Path('admin/clients.html')

          booking_js = r'''\n/* ADMIN_UI_ENHANCEMENTS_START */\n(function(){\n  const style=document.createElement('style');\n  style.textContent=`\n    .uk-date-wrap{display:grid;grid-template-columns:1fr auto;gap:8px;position:relative}\n    .uk-date-wrap .date-calendar-btn{border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink);padding:0 15px;cursor:pointer;font-size:1rem}\n    .uk-date-wrap .date-calendar-btn:hover{background:var(--paper)}\n    .time-scroll{width:100%;min-height:48px;max-height:180px;overflow-y:auto}\n    .time-scroll option{padding:9px 12px}\n  `;document.head.appendChild(style);\n\n  function setupDate(){\n    const visible=document.getElementById('dateUk');\n    if(!visible||visible.dataset.enhanced)return;\n    visible.dataset.enhanced='1';\n    const wrap=document.createElement('div');wrap.className='uk-date-wrap';\n    visible.parentNode.insertBefore(wrap,visible);wrap.appendChild(visible);\n    const button=document.createElement('button');button.type='button';button.className='date-calendar-btn';button.setAttribute('aria-label','Choose date');button.textContent='📅';wrap.appendChild(button);\n    const native=document.createElement('input');native.type='date';native.tabIndex=-1;native.setAttribute('aria-hidden','true');native.style.cssText='position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';wrap.appendChild(native);\n    function sync(){\n      if(!native.value){visible.value='';return;}\n      const [y,m,d]=native.value.split('-');visible.value=`${d}/${m}/${y}`;\n    }\n    button.addEventListener('click',()=>{\n      if(native.showPicker)try{native.showPicker();return;}catch(e){}\n      native.click();\n    });\n    native.addEventListener('change',sync);\n    visible.addEventListener('change',()=>{\n      const v=visible.value.trim().match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/);\n      if(!v)return;native.value=`${v[3]}-${String(v[2]).padStart(2,'0')}-${String(v[1]).padStart(2,'0')}`;\n    });\n    visible.readOnly=true;\n    visible.setAttribute('aria-label','Date (DD/MM/YYYY)');\n    window.__autumnDatePicker={visible,native};\n  }\n\n  function setupTime(){\n    const old=document.getElementById('time');if(!old||old.dataset.enhanced)return;\n    const select=document.createElement('select');select.id='time';select.className='time-scroll';select.size=7;select.required=old.required;\n    for(let minutes=360;minutes<=1320;minutes+=15){const h=Math.floor(minutes/60),m=minutes%60,value=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;const o=document.createElement('option');o.value=value;o.textContent=value;select.appendChild(o);}\n    old.replaceWith(select);\n  }\n  setupDate();setupTime();\n})();\n/* ADMIN_UI_ENHANCEMENTS_END */\n'''

          clients_js = r'''\n/* ADMIN_UI_ENHANCEMENTS_START */\n(function(){\n  const style=document.createElement('style');\n  style.textContent=`\n    .uk-date-wrap{display:grid;grid-template-columns:1fr auto;gap:8px;position:relative}\n    .uk-date-wrap .date-calendar-btn{border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink);padding:0 15px;cursor:pointer;font-size:1rem}\n    .uk-date-wrap .date-calendar-btn:hover{background:var(--paper)}\n    .time-scroll{width:100%;min-height:48px;max-height:180px;overflow-y:auto}\n    .time-scroll option{padding:9px 12px}\n    .history-edit{margin-top:10px}\n    .history-editing{border:1px solid var(--terracotta);box-shadow:0 0 0 2px rgba(191,112,84,.08)}\n  `;document.head.appendChild(style);\n  let treatmentEditingId=null;\n\n  function setupDate(id){\n    const visible=document.getElementById(id);if(!visible||visible.dataset.enhanced)return;\n    visible.dataset.enhanced='1';\n    const wrap=document.createElement('div');wrap.className='uk-date-wrap';visible.parentNode.insertBefore(wrap,visible);wrap.appendChild(visible);\n    const button=document.createElement('button');button.type='button';button.className='date-calendar-btn';button.setAttribute('aria-label','Choose date');button.textContent='📅';wrap.appendChild(button);\n    const native=document.createElement('input');native.type='date';native.tabIndex=-1;native.setAttribute('aria-hidden','true');native.style.cssText='position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';wrap.appendChild(native);\n    function sync(){if(native.value){const [y,m,d]=native.value.split('-');visible.value=`${d}/${m}/${y}`;}}\n    button.addEventListener('click',()=>{if(native.showPicker)try{native.showPicker();return;}catch(e){}native.click();});\n    native.addEventListener('change',sync);\n    visible.readOnly=true;visible.setAttribute('aria-label','Date (DD/MM/YYYY)');\n    visible._ukNativeDate=native;\n  }\n\n  function setupTime(id){\n    const old=document.getElementById(id);if(!old||old.dataset.enhanced)return;\n    const select=document.createElement('select');select.id=id;select.className='time-scroll';select.size=7;select.required=old.required;\n    for(let minutes=360;minutes<=1320;minutes+=15){const h=Math.floor(minutes/60),m=minutes%60,value=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;const o=document.createElement('option');o.value=value;o.textContent=value;select.appendChild(o);}\n    old.replaceWith(select);\n  }\n\n  function setDate(id,iso){const visible=document.getElementById(id);if(!visible)return;const native=visible._ukNativeDate;if(native)native.value=iso||'';if(iso){const [y,m,d]=iso.split('-');visible.value=`${d}/${m}/${y}`;}else visible.value='';}\n  function setTime(id,value){const el=document.getElementById(id);if(el)el.value=value||'';}\n  function serviceIdsFromForm(){return [...document.querySelectorAll('#treatmentServices input[type="checkbox"]:checked')].map(x=>x.value).filter(Boolean);}\n  function addonValues(){return {'nail-art':Number(document.getElementById('addonArt')?.value||0),'nail-stamping':Number(document.getElementById('addonStamp')?.value||0),'nail-stamping-full-set':Number(document.getElementById('addonFullStamp')?.value||0)};}\n  function fillForm(x){\n    treatmentEditingId=x.id;document.getElementById('treatmentForm')?.classList.add('history-editing');\n    setDate('treatmentDate',x.date);setTime('treatmentTime',x.startTime||'');\n    const ids=new Set((x.services||[]).map(s=>s.id));document.querySelectorAll('#treatmentServices input[type="checkbox"]').forEach(cb=>cb.checked=ids.has(cb.value));\n    if(document.getElementById('addonArt'))document.getElementById('addonArt').value=Number(x.addons?.['nail-art']||0);if(document.getElementById('addonStamp'))document.getElementById('addonStamp').value=Number(x.addons?.['nail-stamping']||0);if(document.getElementById('addonFullStamp'))document.getElementById('addonFullStamp').value=Number(x.addons?.['nail-stamping-full-set']||0);\n    if(document.getElementById('treatmentAdjustment'))document.getElementById('treatmentAdjustment').value=(Number(x.priceAdjustmentPence||0)/100).toFixed(2);if(document.getElementById('treatmentPayment'))document.getElementById('treatmentPayment').value=x.paymentStatus||'paid';if(document.getElementById('treatmentNotes'))document.getElementById('treatmentNotes').value=x.notes||'';\n    const submit=document.querySelector('#treatmentForm button[type="submit"]');if(submit)submit.textContent='Save changes';\n    let cancel=document.getElementById('cancelTreatmentEdit');if(!cancel){cancel=document.createElement('button');cancel.type='button';cancel.id='cancelTreatmentEdit';cancel.className='btn secondary';cancel.textContent='Cancel edit';cancel.style.marginLeft='8px';submit?.parentNode?.appendChild(cancel);cancel.onclick=resetEdit;}\n    document.getElementById('treatmentForm')?.scrollIntoView({behavior:'smooth',block:'start'});\n  }\n  function resetEdit(){treatmentEditingId=null;document.getElementById('treatmentForm')?.classList.remove('history-editing');const submit=document.querySelector('#treatmentForm button[type="submit"]');if(submit)submit.textContent='Save completed treatment';document.getElementById('cancelTreatmentEdit')?.remove();}\n  async function decorateHistory(){const clientId=document.getElementById('historyClient')?.value;if(!clientId)return;try{const r=await fetch(API+'/api/admin/clients/'+encodeURIComponent(clientId)+'/history',{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store'});if(!r.ok)return;const d=await r.json(),items=d.history||[],nodes=[...document.querySelectorAll('#historyList .history-item')];nodes.forEach((node,i)=>{const x=items[i];if(!x?.editable||node.querySelector('.history-edit'))return;const b=document.createElement('button');b.type='button';b.className='btn secondary history-edit';b.textContent='Edit';b.onclick=()=>fillForm(x);node.appendChild(b);});}catch(e){}}\n  async function interceptTreatmentSubmit(e){if(!treatmentEditingId)return;e.preventDefault();e.stopImmediatePropagation();const msg=document.getElementById('treatmentMsg');if(msg)msg.textContent='Saving changes…';const adjustment=Math.round(Number(document.getElementById('treatmentAdjustment')?.value||0)*100);const body={clientId:document.getElementById('historyClient')?.value,date:document.getElementById('treatmentDate')?.value.trim(),time:document.getElementById('treatmentTime')?.value||'',services:serviceIdsFromForm(),addons:addonValues(),priceAdjustmentPence:adjustment,paymentStatus:document.getElementById('treatmentPayment')?.value,notes:document.getElementById('treatmentNotes')?.value.trim()||''};try{const r=await fetch(API+'/api/admin/completed-treatment/'+encodeURIComponent(treatmentEditingId),{method:'PATCH',headers:{Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not save changes.');if(msg)msg.textContent='Changes saved.';resetEdit();if(typeof loadHistory==='function')await loadHistory(body.clientId);}catch(err){if(msg)msg.textContent=err.message||'Could not save changes.';}}\n  setupDate('treatmentDate');setupTime('treatmentTime');const form=document.getElementById('treatmentForm');if(form)form.addEventListener('submit',interceptTreatmentSubmit,true);const list=document.getElementById('historyList');if(list)new MutationObserver(()=>decorateHistory()).observe(list,{childList:true,subtree:true});const hc=document.getElementById('historyClient');if(hc)hc.addEventListener('change',()=>setTimeout(decorateHistory,50));setTimeout(decorateHistory,250);\n})();\n/* ADMIN_UI_ENHANCEMENTS_END */\n'''

          def inject(path, code):
              text=path.read_text()
              marker='/* ADMIN_UI_ENHANCEMENTS_START */'
              if marker in text:
                  return False
              pos=text.rfind('</script>')
              if pos < 0:
                  raise SystemExit(f'No closing script tag found in {path}')
              path.write_text(text[:pos]+code+'\n'+text[pos:])
              return True

          changed=inject(booking, booking_js) | inject(clients, clients_js)
          if not changed:
              print('Enhancements already applied; nothing to do.')
              raise SystemExit(0)
          PY

      - name: Commit admin UI enhancements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/booking.html admin/clients.html
          git commit -m "Improve admin date time and treatment history UI"
          git push

# One-off deployment trigger marker.
