name: Final picker close repair
on:
  push:
    paths:
      - '.github/workflows/fix-picker-close-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch picker lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin/booking.html')
          s = p.read_text()
          old = '''function formatUkShort(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return `${d}/${m}/${String(y).slice(-2)}`}function openPicker(id){const el=$(id);try{if(typeof el.showPicker==="function")el.showPicker();else el.click()}catch{el.focus()}}$("dateUk").onclick=()=>openPicker("datePicker");$("datePicker").onchange=()=>{const el=$("datePicker");$("dateUk").value=formatUkShort(el.value);setTimeout(()=>el.blur(),0)};$("timeDisplay").onclick=()=>openPicker("time");$("time").onchange=()=>{const el=$("time");$("timeDisplay").value=el.value||"";setTimeout(()=>el.blur(),0)};'''
          new = '''function formatUkShort(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return `${d}/${m}/${String(y).slice(-2)}`}function openPicker(id){const el=$(id);try{if(typeof el.showPicker==="function")el.showPicker();else el.click()}catch{el.focus()}}function resetNativePicker(el,handler,value){const fresh=el.cloneNode(true);el.replaceWith(fresh);fresh.value=value||"";fresh.addEventListener("change",handler);return fresh}function datePickerChanged(e){const el=e.currentTarget,value=el.value;$("dateUk").value=formatUkShort(value);resetNativePicker(el,datePickerChanged,value)}function timePickerChanged(e){const el=e.currentTarget,value=el.value;$("timeDisplay").value=value||"";resetNativePicker(el,timePickerChanged,value)}$("dateUk").onclick=()=>openPicker("datePicker");$("datePicker").addEventListener("change",datePickerChanged);$("timeDisplay").onclick=()=>openPicker("time");$("time").addEventListener("change",timePickerChanged);'''
          if old not in s:
              raise SystemExit('Expected picker code was not found; refusing to modify file.')
          p.write_text(s.replace(old,new,1))
          PY
          node - <<'JS'
          const fs=require('fs'); const s=fs.readFileSync('admin/booking.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/); if(!m) process.exit(1);
          fs.writeFileSync('/tmp/booking-script.js',m[1]);
          JS
          node --check /tmp/booking-script.js
      - name: Commit fix and remove this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-picker-close-final.yml
          git add admin/booking.html .github/workflows/fix-picker-close-final.yml
          git commit -m 'Fix Safari picker closing' || exit 0
          git push