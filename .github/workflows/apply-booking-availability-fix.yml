name: Apply booking availability fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-booking:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch booking page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('booking.html')
          s = p.read_text()
          replacements = [
              ('Select one or more treatments. Nail Art and stamping can be added below. All appointment spaces are currently 2 hours.',
               'Select one or more treatments. Nail Art and stamping can be added below.'),
              ('apiUrl("/api/availability?service="+encodeURIComponent(selectedServices[0]))',
               'apiUrl("/api/availability?services="+encodeURIComponent(selectedServices.join(",")))'),
              ('<span>${s.start_time}–${s.endTime}</span>',
               '<span>${s.start_time}</span>'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected booking-page text not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-booking-availability-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add booking.html .github/workflows/apply-booking-availability-fix.yml
          git commit -m 'Fix combined-service availability display'
          git push
