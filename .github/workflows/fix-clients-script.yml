name: Fix client page script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-clients-script.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Remove stray escaped newlines from clients page
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = 'admin/clients.html';
            const { data } = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
            const content = Buffer.from(data.content, 'base64').toString('utf8');
            const fixed = content.replace(/\\n\\n\\s*<\\/script>/g, '</script>');
            if (fixed === content) {
              core.info('No stray escaped newline sequence found.');
              return;
            }
            const { data: current } = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Fix clients page JavaScript syntax',
              content: Buffer.from(fixed, 'utf8').toString('base64'),
              sha: current.sha,
              branch: 'main'
            });
      - name: Remove this repair workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/workflows/fix-clients-script.yml';
            const { data } = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
            await github.rest.repos.deleteFile({ owner: context.repo.owner, repo: context.repo.repo, path, message: 'Remove temporary client page repair workflow', sha: data.sha, branch: 'main' });
