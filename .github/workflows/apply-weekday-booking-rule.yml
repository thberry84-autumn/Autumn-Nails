name: Apply weekday one-booking-per-client rule

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch weekday booking rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cloudflare-booking-worker/src/index-duration.js')
          s = p.read_text()

          old1 = """  const duration = await effectiveDurationForBooking(body, serviceIds, env);
  const slotId = Number(body.slotId);
  const slot = await env.DB.prepare(\"SELECT id,date,start_time,status,removed_at FROM availability_slots WHERE id=? LIMIT 1\").bind(slotId).first();
"""
          new1 = """  const slotId = Number(body.slotId);
  const slot = await env.DB.prepare(\"SELECT id,date,start_time,status,removed_at FROM availability_slots WHERE id=? LIMIT 1\").bind(slotId).first();
  if (slot?.date && await clientHasWeekdayBooking(env, body, slot.date)) {
    return corsJson({ error: \"You already have an appointment booked for this weekday. Please choose another day.\" }, 409, request);
  }
  const duration = await effectiveDurationForBooking(body, serviceIds, env, slot?.date);
"""
          if s.count(old1) != 2:
              raise SystemExit(f'Expected two booking guard locations, found {s.count(old1)}')
          s = s.replace(old1, new1, 2)

          old2 = "async function effectiveDurationForBooking(body, serviceIds, env) {"
          new2 = """async function clientHasWeekdayBooking(env, body, date) {
  if (!isWeekday(date)) return false;
  const clientId = String(body.clientId || \"\").trim();
  const email = String(body.email || body.clientEmail || \"\").trim().toLowerCase();
  let id = clientId;
  if (!id && email) {
    const client = await env.DB.prepare(\"SELECT id FROM clients WHERE lower(email)=? LIMIT 1\").bind(email).first();
    id = client?.id || \"\";
  }
  if (!id) return false;
  const existing = await env.DB.prepare(\"SELECT id FROM bookings WHERE client_id=? AND date=? AND status IN ('confirmed','completed') LIMIT 1\").bind(id, date).first();
  return Boolean(existing);
}

function isWeekday(date) {
  const value = String(date || \"\");
  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(value)) return false;
  const day = new Date(`${value}T12:00:00Z`).getUTCDay();
  return day >= 1 && day <= 5;
}

async function effectiveDurationForBooking(body, serviceIds, env, targetDate) {"""
          if s.count(old2) != 1:
              raise SystemExit(f'Expected one duration function marker, found {s.count(old2)}')
          s = s.replace(old2, new2, 1)

          old3 = "const days = qualifying?.date ? daysBetween(qualifying.date, String(body.date || \"\")) : null;"
          new3 = "const days = qualifying?.date && targetDate ? daysBetween(qualifying.date, String(targetDate)) : null;"
          if s.count(old3) != 1:
              raise SystemExit(f'Expected one infill date calculation, found {s.count(old3)}')
          s = s.replace(old3, new3, 1)

          p.write_text(s)
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-weekday-booking-rule.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-booking-worker/src/index-duration.js .github/workflows/apply-weekday-booking-rule.yml
          git commit -m 'Enforce one weekday booking per client'
          git push
