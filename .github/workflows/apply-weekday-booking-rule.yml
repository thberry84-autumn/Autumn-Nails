name: Apply weekday one-booking-per-client rule

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch weekday booking rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cloudflare-booking-worker/src/index-duration.js')
          s = p.read_text()

          replacements = [
            (
              '  const duration = await effectiveDurationForBooking(body, serviceIds, env);\n  const slotId = Number(body.slotId);\n  const slot = await env.DB.prepare("SELECT id,date,start_time,status,removed_at FROM availability_slots WHERE id=? LIMIT 1").bind(slotId).first();\n',
              '  const slotId = Number(body.slotId);\n  const slot = await env.DB.prepare("SELECT id,date,start_time,status,removed_at FROM availability_slots WHERE id=? LIMIT 1").bind(slotId).first();\n  if (slot?.date && await clientHasWeekdayBooking(env, body, slot.date)) {\n    return corsJson({ error: "You already have an appointment booked for this weekday. Please choose another day." }, 409, request);\n  }\n  const duration = await effectiveDurationForBooking(body, serviceIds, env, slot?.date);\n',
            ),
            (
              '  const duration = await effectiveDurationForBooking(body, serviceIds, env);\n  const slotId = Number(body.slotId);\n  const slot = await env.DB.prepare("SELECT id,date,start_time,status,removed_at FROM availability_slots WHERE id=? LIMIT 1").bind(slotId).first();\n',
              '  const slotId = Number(body.slotId);\n  const slot = await env.DB.prepare("SELECT id,date,start_time,status,removed_at FROM availability_slots WHERE id=? LIMIT 1").bind(slotId).first();\n  if (slot?.date && await clientHasWeekdayBooking(env, body, slot.date)) {\n    return corsJson({ error: "You already have an appointment booked for this weekday. Please choose another day." }, 409, request);\n  }\n  const duration = await effectiveDurationForBooking(body, serviceIds, env, slot?.date);\n',
            ),
            (
              'async function effectiveDurationForBooking(body, serviceIds, env) {',
              'async function clientHasWeekdayBooking(env, body, date) {\n  if (!isWeekday(date)) return false;\n  const clientId = String(body.clientId || "").trim();\n  const email = String(body.email || body.clientEmail || "").trim().toLowerCase();\n  let id = clientId;\n  if (!id && email) {\n    const client = await env.DB.prepare("SELECT id FROM clients WHERE lower(email)=? LIMIT 1").bind(email).first();\n    id = client?.id || "";\n  }\n  if (!id) return false;\n  const existing = await env.DB.prepare("SELECT id FROM bookings WHERE client_id=? AND date=? AND status IN ('confirmed','completed') LIMIT 1").bind(id, date).first();\n  return Boolean(existing);\n}\n\nfunction isWeekday(date) {\n  const value = String(date || "");\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(value)) return false;\n  const day = new Date(`${value}T12:00:00Z`).getUTCDay();\n  return day >= 1 && day <= 5;\n}\n\nasync function effectiveDurationForBooking(body, serviceIds, env, targetDate) {'
            ),
            (
              'const days = qualifying?.date ? daysBetween(qualifying.date, String(body.date || "")) : null;',
              'const days = qualifying?.date && targetDate ? daysBetween(qualifying.date, String(targetDate)) : null;'
            ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-weekday-booking-rule.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-booking-worker/src/index-duration.js .github/workflows/apply-weekday-booking-rule.yml
          git commit -m 'Enforce one weekday booking per client'
          git push
