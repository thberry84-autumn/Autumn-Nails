name: Repair booking JS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-booking-js.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair escaped newlines and syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/booking.html')
          s=p.read_text()
          # Convert literal backslash+n characters accidentally inserted into the inline JS
          s=s.replace('\\\\n', '\n')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('admin/booking.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts, 'No inline script found'
          Path('/tmp/booking.js').write_text(scripts[-1])
          PY
          node --check /tmp/booking.js
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/booking.html
          git diff --cached --quiet && { git rm .github/workflows/repair-booking-js.yml; git commit -m 'Remove temporary booking JS repair workflow'; git push; exit 0; }
          git commit -m 'Repair booking admin JavaScript'
          git rm .github/workflows/repair-booking-js.yml
          git commit -m 'Remove temporary booking JS repair workflow'
          git push
