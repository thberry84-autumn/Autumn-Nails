name: Remove public Admin links

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '.github/workflows/remove-public-admin-links.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Admin links from public root pages
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          old = '<a href="/admin/login.html">Admin</a>'
          for path in Path('.').glob('*.html'):
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, ''))
                  changed.append(str(path))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No public Admin links remain.'
          else
            git commit -m 'Remove remaining public Admin links'
            git push
          fi
