<!doctype html><html><head><meta charset="utf-8"><title>Studio Calendar Build Test</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;margin:32px;background:#f7f2ea;color:#332b25}.wrap{max-width:1200px;margin:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}button{padding:10px 16px;border:0;border-radius:10px;background:#6f8067;color:white;font-weight:700}.grid{display:grid;grid-template-columns:80px repeat(7,1fr);overflow:auto;margin-top:18px}.cell{min-height:64px;border:1px solid #e8e0d6;padding:6px}.head{background:#f1e9de;position:sticky;top:0;font-weight:700}.time{font-size:12px;color:#777}.slot{background:#e9f0e5;border-left:4px solid #6f8067;border-radius:8px;padding:7px;margin:2px;font-size:12px}</style></head><body><div class="wrap"><h1>Studio weekly calendar</h1><p>This is the new clean calendar build. It reads the existing Studio availability and booking APIs.</p><button id="load">Load this week</button><div id="status"></div><div id="calendar"></div></div><script>const API='https://studio-booking-api.autumnnails.com';const $=id=>document.getElementById(id);function monday(d){d=new Date(d);const n=d.getDay()||7;d.setDate(d.getDate()-n+1);d.setHours(0,0,0,0);return d}function iso(d){return d.toISOString().slice(0,10)}async function load(){const s=$('status');s.textContent='Loading…';try{const [a,b]=await Promise.all([fetch(API+'/api/availability',{credentials:'include'}),fetch(API+'/api/bookings',{credentials:'include'})]);if(!a.ok||!b.ok)throw new Error('API returned '+a.status+' / '+b.status);const av=await a.json(),bk=await b.json();render(av,bk);s.textContent='Loaded '+(av.length||0)+' available slots and '+(bk.length||0)+' bookings.'}catch(e){s.textContent='Calendar could not load: '+e.message}}function render(av,bk){const start=monday(new Date()),days=[];for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}let h='<div class="grid"><div class="cell head"></div>';for(const d of days)h+='<div class="cell head">'+d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'</div>';for(let hour=6;hour<=22;hour++){h+='<div class="cell time">'+String(hour).padStart(2,'0')+':00</div>';for(const d of days){const date=iso(d);let items=[...(Array.isArray(av)?av:[]).filter(x=>String(x.date||'').slice(0,10)===date),...(Array.isArray(bk)?bk:[]).filter(x=>String(x.date||'').slice(0,10)===date)];items=items.filter(x=>Number(String(x.time||'00:00').slice(0,2))===hour);h+='<div class="cell">'+items.map(x=>'<div class="slot">'+(x.time||'')+' '+(x.service_name||x.service||x.title||'Appointment')+'</div>').join('')+'</div>'}}h+='</div>';$('calendar').innerHTML=h}$('load').onclick=load;load()</script></body></html>
