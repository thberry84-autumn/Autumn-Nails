<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #fff;

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .holding-page {
            text-align: center;
            padding: 40px;
        }

        .coming-soon {
            display: inline-block;
            padding: 18px 40px;
            border: 2px solid #fff;
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        .message {
            margin-top: 25px;
            font-size: 18px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <main class="holding-page">

        <div class="coming-soon">
            Coming Soon
        </div>

        <div class="message">
            Our new website is currently under construction.
        </div>

    </main>

</body>
</html>
