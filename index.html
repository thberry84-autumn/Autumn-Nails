<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autumn Nails — Website coming soon</title>
<meta name="description" content="Autumn Nails — a calm little space for beautiful nails. Our new website is coming soon.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
<link rel="icon" type="image/x-icon" href="/images/autumn-nails-favicon.ico?v=3">
<link rel="shortcut icon" href="/images/autumn-nails-favicon.ico?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#5b3028;
  --ink-soft:#78574d;
  --paper:#f8efe8;
  --paper-2:#f1dfd2;
  --cream:#fffaf6;
  --terracotta:#b86d51;
  --rust:#9f5d46;
  --caramel:#c58c63;
  --amber:#d2a36f;
  --sage:#a8ad96;
  --moss:#8f9378;
  --line:rgba(91,48,40,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 14% 16%, rgba(197,140,99,.22), transparent 28%),
    radial-gradient(circle at 88% 18%, rgba(168,173,150,.17), transparent 24%),
    radial-gradient(circle at 74% 92%, rgba(184,109,81,.11), transparent 28%),
    linear-gradient(135deg,#f6ebe3 0%,#fbf4ee 46%,#f0ddd1 100%);
  overflow-x:hidden;
  overflow-y:auto;
}
.page{position:relative;min-height:100dvh;display:grid;place-items:center;padding:28px;isolation:isolate;}
.page::before,.page::after{content:"";position:absolute;border-radius:50%;filter:blur(10px);z-index:-2;}
.page::before{width:min(44vw,620px);aspect-ratio:1;left:-16vw;bottom:-30vw;background:rgba(197,140,99,.17);}
.page::after{width:min(34vw,500px);aspect-ratio:1;right:-10vw;top:-17vw;background:rgba(159,93,70,.10);}
.frame{position:relative;width:min(1180px,100%);min-height:min(760px,calc(100dvh - 56px));display:grid;grid-template-columns:minmax(0,1.08fr) minmax(280px,.92fr);background:rgba(255,250,246,.83);border:1px solid rgba(255,255,255,.78);border-radius:34px;box-shadow:0 28px 80px rgba(91,48,40,.14), inset 0 1px 0 rgba(255,255,255,.86);overflow:hidden;backdrop-filter:blur(10px);}
.content{display:flex;flex-direction:column;justify-content:center;padding:clamp(44px,7vw,96px);position:relative;z-index:2;}
.eyebrow{display:flex;align-items:center;gap:16px;font-size:.69rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:42px;}
.eyebrow::before{content:"";width:48px;height:1px;background:linear-gradient(90deg,var(--terracotta),var(--amber));}
.brand{position:relative;display:inline-block;width:max-content;margin-bottom:46px;padding-right:18px;}
.brand-main{font-family:"Allura","Snell Roundhand","Segoe Script",cursive;font-size:clamp(4.4rem,7.5vw,7.8rem);line-height:.82;font-weight:400;letter-spacing:-.02em;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.55);}
.brand-sub{text-align:right;margin-top:10px;padding-right:9px;font-size:.74rem;letter-spacing:.62em;text-transform:lowercase;font-weight:400;color:var(--ink);}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(3.2rem,7.2vw,7.4rem);line-height:.86;font-weight:400;letter-spacing:-.045em;margin:0;max-width:780px;color:var(--ink);}
h1 em{font-style:italic;font-weight:400;color:var(--terracotta);}
.copy{max-width:560px;margin:30px 0 0;font-size:clamp(.95rem,1.35vw,1.08rem);line-height:1.9;font-weight:300;color:var(--ink-soft);}
.signature{display:flex;align-items:center;gap:14px;margin-top:48px;font-size:.7rem;text-transform:uppercase;letter-spacing:.22em;color:#8b685d;}
.signature span{display:block;width:26px;height:1px;background:var(--sage);}
.art{position:relative;min-height:100%;background:linear-gradient(160deg,rgba(232,195,178,.82),rgba(245,227,214,.60) 44%,rgba(210,163,111,.18) 70%,rgba(168,173,150,.24));overflow:hidden;}
.art::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.54),transparent 42%),radial-gradient(circle at 62% 35%,rgba(255,255,255,.88),transparent 18%);}
.nail-card{position:absolute;left:50%;top:50%;width:min(72%,390px);aspect-ratio:.72;transform:translate(-48%,-50%) rotate(4deg);border-radius:180px 180px 36px 36px;background:linear-gradient(160deg,#fff8f2 0%,#eed2c0 55%,#c98d68 100%);box-shadow:0 35px 70px rgba(91,48,40,.18), inset 0 1px 0 rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.75);}
.nail-card::before{content:"";position:absolute;width:55%;aspect-ratio:1;left:16%;top:17%;border-radius:50%;background:radial-gradient(circle at 38% 35%,rgba(255,255,255,.92) 0 9%,rgba(255,255,255,.18) 10% 34%,transparent 35%),linear-gradient(145deg,#c68461,#e8b7a0 48%,#8e5a4d);filter:saturate(.78);box-shadow:24px 46px 0 -8px rgba(167,170,142,.20);}
.nail-card::after{content:"";position:absolute;width:112px;height:190px;right:14%;bottom:12%;border-radius:60px 60px 34px 34px;background:linear-gradient(145deg,#e9c5b2,#a96852);transform:rotate(19deg);box-shadow:-52px 8px 0 -18px rgba(125,90,81,.13);opacity:.88;}
.stamp{position:absolute;right:8%;bottom:7%;width:108px;aspect-ratio:1;border:1px solid rgba(91,48,40,.24);border-radius:50%;display:grid;place-items:center;text-align:center;transform:rotate(-12deg);color:rgba(91,48,40,.68);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:1.05rem;letter-spacing:.04em;background:rgba(255,250,246,.34);backdrop-filter:blur(6px);}
.botanical{position:absolute;z-index:1;opacity:.30;filter:drop-shadow(0 6px 10px rgba(91,48,40,.05));}
.botanical svg{display:block;width:100%;height:100%;}
.botanical.left{width:220px;height:270px;left:-28px;bottom:6px;}
.botanical.top-right{width:220px;height:240px;right:-20px;top:0;opacity:.20;}
.botanical.mid-right{width:150px;height:180px;right:6%;bottom:18%;opacity:.18;}
.botanical.content-corner{width:145px;height:180px;right:8%;top:58px;opacity:.15;}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.08;background-image:repeating-linear-gradient(0deg, rgba(91,48,40,.035) 0 1px, transparent 1px 4px);mix-blend-mode:multiply;}
@media(max-width:820px){.page{padding:14px}.frame{grid-template-columns:1fr;min-height:calc(100dvh - 28px);border-radius:26px}.content{padding:48px 30px 40px}.art{min-height:280px}.nail-card{width:180px;aspect-ratio:1.18;border-radius:90px 90px 28px 28px;transform:translate(-50%,-46%) rotate(5deg)}.nail-card::after{width:62px;height:100px}.stamp{width:74px;font-size:.82rem}.eyebrow{margin-bottom:30px}.brand{margin-bottom:34px}.copy{line-height:1.7}.signature{margin-top:34px}.botanical.left{width:140px;height:170px;left:-18px;bottom:-6px}.botanical.top-right{width:140px;height:150px;right:-14px}.botanical.content-corner{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="page">
  <section class="frame" aria-labelledby="coming-soon-title">
    <div class="grain"></div>
    <div class="botanical left" aria-hidden="true">
      <svg viewBox="0 0 220 270" fill="none">
        <path d="M52 238C92 208 126 154 160 54" stroke="#8f9378" stroke-width="2"/>
        <path d="M74 214C55 188 58 164 81 142C103 157 108 184 92 203C87 210 81 214 74 214Z" fill="#b86d51"/>
        <path d="M102 181C82 154 89 126 115 105C138 120 143 146 125 166C119 174 111 180 102 181Z" fill="#c58c63"/>
        <path d="M126 145C110 120 116 93 140 74C162 88 167 114 149 133C143 140 136 144 126 145Z" fill="#d2a36f"/>
        <path d="M144 104C133 84 140 62 158 46C177 59 180 79 165 96C160 101 153 104 144 104Z" fill="#a8ad96"/>
        <path d="M97 231C110 204 129 180 145 144" stroke="#9f5d46" stroke-width="1.5"/>
        <path d="M121 196C136 168 151 136 161 103" stroke="#9f5d46" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="content">
      <div class="botanical content-corner" aria-hidden="true">
        <svg viewBox="0 0 160 200" fill="none">
          <path d="M34 180C64 148 90 102 118 32" stroke="#8f9378" stroke-width="1.7"/>
          <path d="M50 161C37 143 40 124 55 109C72 119 76 138 64 152C60 157 56 160 50 161Z" fill="#d2a36f"/>
          <path d="M72 132C59 113 63 92 81 76C97 86 100 106 88 120C84 126 79 130 72 132Z" fill="#b86d51"/>
          <path d="M94 99C84 81 88 62 104 49C118 58 122 75 111 89C107 94 101 98 94 99Z" fill="#a8ad96"/>
        </svg>
      </div>
      <div class="eyebrow">A calm little space for you</div>
      <div class="brand" role="img" aria-label="Autumn Nails">
        <div class="brand-main">Autumn</div>
        <div class="brand-sub">nails</div>
      </div>
      <h1 id="coming-soon-title">Something beautiful is <em>coming soon.</em></h1>
      <p class="copy">Our new website is being carefully created. Autumn Nails is still here as normal in the meantime — with the same personal, relaxed experience and beautiful nails.</p>
      <div class="signature"><span></span> Autumn Nails</div>
    </div>
    <div class="art" aria-hidden="true">
      <div class="botanical top-right">
        <svg viewBox="0 0 220 240" fill="none">
          <path d="M58 209C102 176 142 126 176 40" stroke="#8f9378" stroke-width="2"/>
          <path d="M82 187C64 163 66 138 89 118C111 132 116 159 99 178C94 184 88 187 82 187Z" fill="#b86d51"/>
          <path d="M110 153C91 128 96 100 122 80C145 95 149 121 131 141C125 148 118 152 110 153Z" fill="#c58c63"/>
          <path d="M136 114C122 92 126 69 145 53C165 65 169 87 154 103C149 109 143 113 136 114Z" fill="#a8ad96"/>
        </svg>
      </div>
      <div class="botanical mid-right">
        <svg viewBox="0 0 160 200" fill="none">
          <path d="M40 176C67 145 93 102 120 35" stroke="#9f5d46" stroke-width="1.7"/>
          <path d="M56 157C43 139 46 121 61 106C78 115 82 135 70 149C66 154 62 157 56 157Z" fill="#d2a36f"/>
          <path d="M78 128C65 109 69 88 87 72C103 82 106 102 94 116C90 122 85 126 78 128Z" fill="#b86d51"/>
          <path d="M101 95C91 77 95 59 111 46C125 55 129 72 118 86C114 91 108 94 101 95Z" fill="#a8ad96"/>
        </svg>
      </div>
      <div class="nail-card"></div>
      <div class="stamp">coming<br>soon</div>
    </div>
  </section>
</main>
</body>
</html>
