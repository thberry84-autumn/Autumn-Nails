<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autumn Nails — Website coming soon</title>
<meta name="description" content="Autumn Nails — a calm little space for beautiful nails. Our new website is coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#5b3028;
  --ink-soft:#7d5a51;
  --paper:#f8efe8;
  --paper-2:#f2dfd2;
  --blush:#e8c3b2;
  --peach:#ddb08f;
  --sage:#a8ad96;
  --white:#fffaf6;
  --line:rgba(91,48,40,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  min-height:100dvh;
  font-family:'Montserrat',Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 18%, rgba(232,195,178,.58), transparent 30%),
    radial-gradient(circle at 84% 20%, rgba(168,173,150,.20), transparent 24%),
    linear-gradient(135deg,#f6ebe3 0%,#f9f1eb 52%,#f1dfd4 100%);
  overflow:hidden;
}
.page{position:relative;min-height:100dvh;display:grid;place-items:center;padding:28px;isolation:isolate;}
.page::before,.page::after{content:"";position:absolute;border-radius:999px;filter:blur(2px);z-index:-1;}
.page::before{width:min(44vw,640px);aspect-ratio:1;left:-15vw;bottom:-30vw;background:rgba(221,176,143,.22);}
.page::after{width:min(34vw,520px);aspect-ratio:1;right:-10vw;top:-17vw;background:rgba(168,173,150,.14);}
.frame{
  position:relative;
  width:min(1180px,100%);
  min-height:min(760px,calc(100dvh - 56px));
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(280px,.92fr);
  background:rgba(255,250,246,.78);
  border:1px solid rgba(255,255,255,.72);
  border-radius:34px;
  box-shadow:0 28px 80px rgba(91,48,40,.14), inset 0 1px 0 rgba(255,255,255,.8);
  overflow:hidden;
  backdrop-filter:blur(10px);
}
.content{display:flex;flex-direction:column;justify-content:center;padding:clamp(44px,7vw,96px);position:relative;}
.eyebrow{display:flex;align-items:center;gap:16px;font-size:.69rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:42px;}
.eyebrow::before{content:"";width:48px;height:1px;background:var(--peach);}
.brand{display:inline-block;width:max-content;margin-bottom:44px;}
.brand-main{font-family:'Yellowtail','Brush Script MT',cursive;font-size:clamp(3.7rem,7vw,7.2rem);line-height:.76;font-weight:400;letter-spacing:-.035em;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.55);}
.brand-main .a{font-size:1.28em;margin-right:-.05em;}
.brand-sub{text-align:right;margin-top:10px;padding-right:7px;font-size:.74rem;letter-spacing:.62em;text-transform:lowercase;font-weight:400;color:var(--ink);}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(3.2rem,7.2vw,7.6rem);line-height:.84;font-weight:300;letter-spacing:-.035em;margin:0;max-width:780px;color:var(--ink);}
h1 em{font-style:italic;font-weight:300;color:#9a6759;}
.copy{max-width:560px;margin:30px 0 0;font-size:clamp(.95rem,1.35vw,1.1rem);line-height:1.9;font-weight:300;color:var(--ink-soft);}
.signature{display:flex;align-items:center;gap:14px;margin-top:48px;font-size:.7rem;text-transform:uppercase;letter-spacing:.22em;color:#8c6a61;}
.signature span{display:block;width:26px;height:1px;background:var(--sage);}
.art{position:relative;min-height:100%;background:linear-gradient(160deg,rgba(232,195,178,.76),rgba(246,231,220,.54) 48%,rgba(168,173,150,.24));overflow:hidden;}
.art::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.52),transparent 42%),radial-gradient(circle at 60% 35%,rgba(255,255,255,.9),transparent 16%);}
.nail-card{position:absolute;left:50%;top:50%;width:min(72%,390px);aspect-ratio:.72;transform:translate(-48%,-50%) rotate(4deg);border-radius:180px 180px 36px 36px;background:linear-gradient(160deg,#fff8f2 0%,#ecd1c1 58%,#ddb08f 100%);box-shadow:0 35px 70px rgba(91,48,40,.18),inset 0 1px 0 rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.75);}
.nail-card::before{content:"";position:absolute;width:55%;aspect-ratio:1;left:16%;top:17%;border-radius:50%;background:radial-gradient(circle at 38% 35%,rgba(255,255,255,.92) 0 9%,rgba(255,255,255,.18) 10% 34%,transparent 35%),linear-gradient(145deg,#d79b7b,#f3cfc0 48%,#8e5a4d);filter:saturate(.8);box-shadow:24px 46px 0 -8px rgba(168,173,150,.23);}
.nail-card::after{content:"";position:absolute;width:112px;height:190px;right:14%;bottom:12%;border-radius:60px 60px 34px 34px;background:linear-gradient(145deg,#f3d4c6,#b77d68);transform:rotate(19deg);box-shadow:-52px 8px 0 -18px rgba(125,90,81,.13);opacity:.86;}
.stamp{position:absolute;right:8%;bottom:7%;width:108px;aspect-ratio:1;border:1px solid rgba(91,48,40,.24);border-radius:50%;display:grid;place-items:center;transform:rotate(-12deg);color:rgba(91,48,40,.66);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;letter-spacing:.05em;background:rgba(255,250,246,.30);backdrop-filter:blur(6px);}
.flower{position:absolute;width:210px;height:210px;border:1px solid rgba(91,48,40,.08);border-radius:46% 54% 58% 42% / 43% 39% 61% 57%;transform:rotate(34deg);right:-50px;top:8%;}
.flower::before,.flower::after{content:"";position:absolute;inset:28px;border:1px solid rgba(91,48,40,.07);border-radius:57% 43% 47% 53% / 41% 62% 38% 59%;transform:rotate(36deg)}
.flower::after{inset:58px;transform:rotate(68deg)}
@media(max-width:820px){body{overflow:auto}.page{padding:14px}.frame{grid-template-columns:1fr;min-height:calc(100dvh - 28px);border-radius:26px}.content{padding:48px 30px 40px}.art{min-height:230px}.nail-card{width:180px;aspect-ratio:1.18;border-radius:90px 90px 28px 28px;transform:translate(-50%,-46%) rotate(5deg)}.nail-card::after{width:62px;height:100px}.stamp{width:74px;font-size:.88rem}.eyebrow{margin-bottom:30px}.brand{margin-bottom:34px}.copy{line-height:1.7}.signature{margin-top:34px}}
@media(max-height:650px) and (min-width:821px){.frame{min-height:calc(100dvh - 36px)}.page{padding:18px}.content{padding:38px 58px}.eyebrow{margin-bottom:24px}.brand{margin-bottom:28px}.copy{margin-top:22px}.signature{margin-top:28px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="page">
  <section class="frame" aria-labelledby="coming-soon-title">
    <div class="content">
      <div class="eyebrow">A calm little space for you</div>
      <div class="brand" role="img" aria-label="Autumn Nails">
        <div class="brand-main"><span class="a">A</span>utumn</div>
        <div class="brand-sub">nails</div>
      </div>
      <h1 id="coming-soon-title">Something beautiful is <em>coming soon.</em></h1>
      <p class="copy">Our new website is being carefully created. Autumn Nails is still here as normal in the meantime — with the same personal, relaxed experience and beautiful nails.</p>
      <div class="signature"><span></span> Autumn Nails</div>
    </div>
    <div class="art" aria-hidden="true">
      <div class="flower"></div>
      <div class="nail-card"></div>
      <div class="stamp">coming<br>soon</div>
    </div>
  </section>
</main>
</body>
</html>
